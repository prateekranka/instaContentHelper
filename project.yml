name: CreatorContentOS
options:
  bundleIdPrefix: com.creatorcontenthelper
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.0.0"
targets:
  CreatorContentOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - CreatorContentOS
    dependencies:
      - package: Supabase
        product: Supabase
      - target: MiraShareExtension
        embed: true
    preBuildScripts:
      - name: Require Live Release Bootstrap
        script: |
          /bin/sh "$SRCROOT/scripts/require-live-release-bootstrap.sh"
        basedOnDependencyAnalysis: false
    configFiles:
      Debug: CreatorContentOS/Config/Runtime.xcconfig
      Release: CreatorContentOS/Config/Runtime.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prateekranka.creatorcontenthelper
        PRODUCT_NAME: ContentHelper
        PRODUCT_MODULE_NAME: CreatorContentOS
        DEVELOPMENT_TEAM: 4JRB53LG5C
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: CreatorContentOS/CreatorContentOS.entitlements
        INFOPLIST_FILE: CreatorContentOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2026081102"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    entitlements:
      path: CreatorContentOS/CreatorContentOS.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.com.prateekranka.creatorcontenthelper
  MiraShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - MiraShareExtension
      - CreatorContentOS/Mira/MiraSharedBriefInbox.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prateekranka.creatorcontenthelper.MiraShare
        DEVELOPMENT_TEAM: 4JRB53LG5C
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2026081102"
    info:
      path: MiraShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Mira
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $item,
              SUBQUERY($item.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.text"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf").@count > 0).@count > 0
    entitlements:
      path: MiraShareExtension/MiraShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.prateekranka.creatorcontenthelper
  InstalledContentHelperUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - InstalledContentHelperUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prateekranka.creatorcontenthelper.installed-ui-tests
        DEVELOPMENT_TEAM: 4JRB53LG5C
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ""
        TESTFLIGHT_APP_BUNDLE_IDENTIFIER: com.prateekranka.creatorcontenthelper
schemes:
  CreatorContentOS:
    build:
      targets:
        CreatorContentOS: all
    run:
      config: Debug
  InstalledContentHelperUITests:
    build:
      targets:
        InstalledContentHelperUITests: [test]
    test:
      targets:
        - InstalledContentHelperUITests
