<script>
const CARD = {
  date: "30 July 2026",
  title: "Race week has entered the house",
  hook: "Race week starts with the shoes by the door.",
  effort: "Easy · 10 min",
  scenes: [
    { n: 1, title: "Shoes by the door", duration: "3 sec" },
    { n: 2, title: "Open the journal", duration: "4 sec" },
    { n: 3, title: "Bottle, timer, breath", duration: "3 sec" },
    { n: 4, title: "One steady stride", duration: "2 sec" },

  caption: "Race week starts quiet. Shoes by the door. One honest line in the journal. Then out.",
  audio: "Steady mid-tempo — keep VO soft over the first stride.",
  script: "Race week starts with the shoes by the door. Then I open the journal and write one honest line. Bottle, timer, breath. Keep it small. One steady stride is enough for today.",

const axes = [
  "Steady List — Call Sheet IA + calm verbs",
  "Morning Brief — Soft Coach greeting over list",
  "Pocket Sheet — one primary CTA, denser cues",

const shot = new Set();
function toggleShot(n) {
  if (shot.has(n)) shot.delete(n);
  else shot.add(n);
  showToast(shot.has(n) ? `Scene ${n} marked shot` : `Scene ${n} unmarked`);
  mount(current);
}
function copyText(label, text) {
  navigator.clipboard?.writeText(text).catch(() => {});
  showToast(`${label} copied`);
}
let toastTimer;
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.setAttribute("data-show", "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.removeAttribute("data-show"), 1400);
}

function statusBar() {
  return `<div class="sb"><span>9:41</span><span>●●●</span></div>`;
}

function primaryLabel() {
  return shot.size === CARD.scenes.length
    ? "I’m done — mark posted"
    : shot.size === 0
      ? "Mark all as shot"
      : `Mark remaining (${CARD.scenes.length - shot.size})`;
}

function steadyList() {
  const rows = CARD.scenes.map(s => `
    <div class="sl-row" ${shot.has(s.n) ? "data-shot" : ""} onclick="toggleShot(${s.n})">
      <div class="sl-num">${shot.has(s.n) ? "✓" : String(s.n).padStart(2,"0")}</div>
      <div>
        <div class="sl-row-t">${s.title}</div>
        ${shot.has(s.n) ? "" : `<div class="sl-row-d">Tap when you’ve got this one</div>`}
      </div>
      <div class="sl-dur">${s.duration}</div>
    </div>`).join("");
  return `
    <div class="sl">
      ${statusBar()}
      <div class="sl-head">
        <div class="sl-meta"><span>Today</span><span>${CARD.date}</span></div>
        <h1 class="sl-title">${CARD.title}</h1>
        <p class="sl-sub">${CARD.hook}</p>
      </div>
      <div class="sl-progress">
        <span class="sl-dot"></span>
        <span>${shot.size} of ${CARD.scenes.length} shot · ${CARD.effort}</span>
      </div>
      <div class="sl-list">
        <div class="sl-section">Scenes</div>
        ${rows}
        <div class="sl-section">Package</div>
        <div class="sl-copy">
          <label>Caption</label>
          <p>${CARD.caption}</p>
          <button class="sl-copy-btn press" onclick="event.stopPropagation(); copyText('Caption', CARD.caption)">Copy caption</button>
        </div>
        <div class="sl-copy">
          <label>Audio</label>
          <p>${CARD.audio}</p>
          <button class="sl-copy-btn press" onclick="event.stopPropagation(); copyText('Audio', CARD.audio)">Copy audio note</button>
        </div>
      </div>
      <div class="sl-footer">
        <button class="sl-btn sl-btn-ghost press" onclick="showToast('Other ideas sheet')">Need something easier</button>
        <button class="sl-btn sl-btn-fill press" onclick="showToast(shot.size === CARD.scenes.length ? 'Mark posted' : 'Marked remaining shot')">${primaryLabel()}</button>
      </div>
      <div class="sl-tabs"><span data-on>Today</span><span>Archive</span><span>Profile</span></div>
    </div>`;
}

function morningBrief() {
  const rows = CARD.scenes.map(s => `
    <div class="mb-row" ${shot.has(s.n) ? "data-shot" : ""} onclick="toggleShot(${s.n})">
      <div class="mb-check"></div>
      <div>
        <div class="mb-row-t">${s.n}. ${s.title}</div>
        ${shot.has(s.n) ? `<div class="mb-row-d">Got it</div>` : `<div class="mb-row-d">Tap when shot</div>`}
      </div>
      <div class="mb-dur">${s.duration}</div>
    </div>`).join("");
  return `
    <div class="mb">
      ${statusBar()}
      <div class="mb-brief">
        <div class="mb-day">Today · ${CARD.date}</div>
        <h1 class="mb-line">You’ve got one easy shoot ready.</h1>
        <p class="mb-support">${CARD.title} — ${CARD.hook}</p>
        <span class="mb-chip">${shot.size} of ${CARD.scenes.length} shot · ${CARD.effort}</span>
      </div>
      <div class="mb-list">
        <div class="mb-section">Scenes</div>
        ${rows}
        <div class="mb-section">Package</div>
        <div class="mb-copy">
          <strong>Caption</strong>
          <p>${CARD.caption}</p>
          <button class="mb-copy-btn press" onclick="event.stopPropagation(); copyText('Caption', CARD.caption)">Copy caption</button>
        </div>
        <div class="mb-copy">
          <strong>Audio</strong>
          <p>${CARD.audio}</p>
          <button class="mb-copy-btn press" onclick="event.stopPropagation(); copyText('Audio', CARD.audio)">Copy audio note</button>
        </div>
      </div>
      <div class="mb-actions">
        <button class="mb-fab press" onclick="showToast(shot.size === CARD.scenes.length ? 'Mark posted' : 'Keep going — ' + (CARD.scenes.length - shot.size) + ' left')">${
          shot.size === CARD.scenes.length ? "I’m done — mark posted" : "I’m shooting this"
        }</button>
        <button class="mb-alt press" onclick="showToast('Other ideas sheet')">Need something easier</button>
      </div>
      <div class="mb-tabs"><span data-on>Today</span><span>Archive</span><span>Profile</span></div>
    </div>`;
}

function pocketSheet() {
  const rows = CARD.scenes.map(s => `
    <div class="ps-row" ${shot.has(s.n) ? "data-shot" : ""}>
      <div class="ps-num" onclick="toggleShot(${s.n})">${shot.has(s.n) ? "✓" : String(s.n).padStart(2,"0")}</div>
      <div onclick="toggleShot(${s.n})">
        <div class="ps-row-t">${s.title}</div>
        <div class="ps-row-d">${s.duration}</div>
      </div>
      <button class="ps-mark press" onclick="event.stopPropagation(); toggleShot(${s.n})">${shot.has(s.n) ? "Undo" : "Shot"}</button>
    </div>`).join("");
  return `
    <div class="ps">
      ${statusBar()}
      <div class="ps-head">
        <div class="ps-kicker">Today · ${CARD.date}</div>
        <h1 class="ps-title">${CARD.title}</h1>
        <p class="ps-hook">${CARD.hook}</p>
      </div>
      <div class="ps-rail">
        <span class="ps-pill" data-on>Scenes</span>
        <span class="ps-pill">${shot.size}/${CARD.scenes.length} shot</span>
        <span class="ps-pill">${CARD.effort}</span>
      </div>
      <div class="ps-list">${rows}</div>
      <div class="ps-pkg">
        <div class="ps-pkg-row">
          <div>
            <div class="ps-pkg-label">Caption</div>
            <div class="ps-pkg-body">${CARD.caption}</div>
          </div>
          <button class="ps-pkg-copy press" onclick="copyText('Caption', CARD.caption)">Copy</button>
        </div>
        <div class="ps-pkg-row">
          <div>
            <div class="ps-pkg-label">Audio</div>
            <div class="ps-pkg-body">${CARD.audio}</div>
          </div>
          <button class="ps-pkg-copy press" onclick="copyText('Audio', CARD.audio)">Copy</button>
        </div>
      </div>
      <div class="ps-dock">
        <button class="ps-primary press" onclick="showToast(shot.size === CARD.scenes.length ? 'Mark posted' : 'Marked remaining shot')">${
          shot.size === CARD.scenes.length ? "I’m done — mark posted" : "Mark remaining as shot"
        }</button>
        <button class="ps-secondary press" onclick="showToast('Other ideas sheet')">Need something easier</button>
      </div>
      <div class="ps-tabs"><span data-on>Today</span><span>Archive</span><span>Profile</span></div>
    </div>`;
}

const variants = [steadyList, morningBrief, pocketSheet];
const stage = document.getElementById("stage");
const picker = document.querySelector(".proto-picker");
const highlight = picker.querySelector(".proto-picker-highlight");
const items = [...picker.querySelectorAll(".proto-picker-item:not(.proto-picker-replay)")];
const replay = picker.querySelector(".proto-picker-replay");
const axisLabel = document.getElementById("axis-label");
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + "px";
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = "";
  requestAnimationFrame(() => {
    stage.innerHTML = variants[i]();
  });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute("data-active", j === i);
    if (j === i) el.setAttribute("aria-current", "true");
    else el.removeAttribute("aria-current");
  });
  axisLabel.textContent = axes[i];
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set("v", i + 1);
  history.replaceState(null, "", url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener("click", () => setActive(i)));
replay?.addEventListener("click", () => mount(current));
window.addEventListener("resize", moveHighlight);

document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === "ArrowRight") setActive((current + 1) % variants.length);
  else if (e.key === "ArrowLeft") setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === "r" || e.key === "R") mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get("v"), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute("data-ready", "")));
</script>
</body>
