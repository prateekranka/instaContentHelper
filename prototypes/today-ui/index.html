<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE — Content Helper · Pocket Sheet shell</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0c0c0d;
    color: #f4f4f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .harness {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 32px 16px 48px;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, #1a1a1f, transparent),
      #0c0c0d;
  }
  .harness-meta {
    position: fixed;
    top: 16px;
    left: 16px;
    right: 16px;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    pointer-events: none;
    font-size: 12px;
    color: rgba(255,255,255,0.45);
  }
  .harness-meta strong { color: rgba(255,255,255,0.72); font-weight: 600; }
  .phone {
    width: 390px;
    height: 844px;
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.08),
      0 40px 80px rgba(0,0,0,0.55);
    background: #fafafa;
  }
  .phone-notch {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 34px;
    background: #000;
    border-radius: 20px;
    z-index: 5;
    pointer-events: none;
  }
  #app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    color: #111;
    background: #fafafa;
  }
  .sb {
    display: flex;
    justify-content: space-between;
    padding: 16px 28px 8px;
    font-size: 14px;
    font-weight: 600;
  }
  .screen {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .press:active { transform: scale(0.97); }

  .toast {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 96px;
    z-index: 40;
    padding: 12px 14px;
    border-radius: 14px;
    background: rgba(10,10,10,0.88);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: opacity 180ms cubic-bezier(0.23, 1, 0.32, 1), transform 180ms cubic-bezier(0.23, 1, 0.32, 1);
  }
  .toast[data-show] { opacity: 1; transform: none; }

  /* Shared tab bar */
  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0;
    padding: 8px 8px 14px;
    background: #fafafa;
    border-top: 1px solid #e5e5e5;
  }
  .tab {
    border: 0;
    background: transparent;
    font: inherit;
    font-size: 11px;
    font-weight: 650;
    color: #a3a3a3;
    padding: 8px;
    cursor: pointer;
    transition: color 140ms ease-out, transform 140ms ease-out;
  }
  .tab[data-on] { color: #111; }
  .tab[data-center] { font-size: 12px; font-weight: 700; }
  .tab:active { transform: scale(0.97); }

  /* ——— Today / Pocket Sheet ——— */
  .ps-head { padding: 4px 20px 12px; }
  .ps-kicker {
    font-size: 12px;
    font-weight: 600;
    color: #737373;
    margin-bottom: 6px;
  }
  .ps-title {
    font-size: 20px;
    font-weight: 650;
    letter-spacing: -0.02em;
    line-height: 1.25;
    margin: 0;
  }
  .ps-rail {
    display: flex;
    gap: 8px;
    padding: 0 20px 12px;
  }
  .ps-pill {
    font-size: 12px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 999px;
    background: #f5f5f5;
    color: #404040;
    border: 1px solid #e5e5e5;
  }
  .ps-list { border-top: 1px solid #e5e5e5; }
  .ps-row {
    display: grid;
    grid-template-columns: 56px 1fr 52px;
    gap: 12px;
    align-items: center;
    min-height: 72px;
    padding: 12px 20px;
    border-bottom: 1px solid #e5e5e5;
    cursor: pointer;
  }
  .ps-row:active { background: #f5f5f5; }
  .ps-thumb {
    position: relative;
    width: 56px;
    height: 56px;
    border-radius: 12px;
    overflow: hidden;
    background: #e5e5e5;
  }
  .ps-thumb svg { width: 100%; height: 100%; display: block; }
  .ps-thumb-n {
    position: absolute;
    left: 6px;
    bottom: 5px;
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.55);
  }
  .ps-row[data-shot] .ps-thumb {
    outline: 2px solid #111;
    outline-offset: 1px;
  }
  .ps-row[data-shot] .ps-thumb::after {
    content: "✓";
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(17,17,17,0.42);
    color: #fff;
    font-size: 18px;
    font-weight: 700;
  }
  .ps-row[data-shot] .ps-row-t { color: #a3a3a3; text-decoration: line-through; }
  .ps-row-t { font-size: 15px; font-weight: 600; }
  .ps-row-d { font-size: 12px; color: #737373; margin-top: 2px; }
  .ps-mark {
    height: 34px;
    padding: 0 10px;
    border-radius: 10px;
    border: 1px solid #d4d4d4;
    background: #fff;
    font-size: 12px;
    font-weight: 650;
    color: #404040;
    cursor: pointer;
    transition: transform 140ms ease-out, background 160ms ease-out, color 160ms ease-out, border-color 160ms ease-out;
  }
  .ps-row[data-shot] .ps-mark {
    border-color: #111;
    background: #111;
    color: #fff;
  }
  .ps-pkg {
    padding: 14px 20px 8px;
    background: #f5f5f5;
    border-top: 1px solid #e5e5e5;
  }
  .ps-pkg-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 0;
  }
  .ps-pkg-row + .ps-pkg-row { border-top: 1px solid #e5e5e5; }
  .ps-pkg-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #a3a3a3;
    margin-bottom: 4px;
  }
  .ps-pkg-body {
    font-size: 13px;
    line-height: 1.4;
    color: #404040;
    max-width: 42ch;
  }
  .ps-pkg-copy {
    flex: 0 0 auto;
    height: 34px;
    padding: 0 12px;
    border-radius: 10px;
    border: 1px solid #d4d4d4;
    background: #fff;
    font-size: 12px;
    font-weight: 650;
    color: #111;
    cursor: pointer;
    transition: transform 140ms ease-out;
  }
  .ps-audio-section {
    padding: 12px 0 4px;
    border-top: 1px solid #e5e5e5;
  }
  .ps-audio-section .ps-pkg-label { margin-bottom: 10px; }
  .ps-audio-track {
    padding: 10px 0;
    border-top: 1px solid #ebebeb;
  }
  .ps-audio-track:first-of-type { border-top: 0; padding-top: 0; }
  .ps-audio-kind {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }
  .ps-audio-kind-l {
    font-size: 12px;
    font-weight: 650;
    color: #525252;
  }
  .ps-audio-rank {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: #737373;
    padding: 3px 8px;
    border-radius: 999px;
    background: #fff;
    border: 1px solid #e5e5e5;
  }
  .ps-audio-rank[data-hot] {
    background: #111;
    border-color: #111;
    color: #fff;
  }
  .ps-audio-row {
    display: grid;
    grid-template-columns: 40px 1fr auto;
    gap: 10px;
    align-items: center;
  }
  .ps-audio-play {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    border: 1px solid #d4d4d4;
    background: #fff;
    font-size: 14px;
    color: #111;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: transform 140ms ease-out, background 140ms ease-out;
  }
  .ps-audio-play[data-on] {
    background: #111;
    border-color: #111;
    color: #fff;
  }
  .ps-audio-name {
    font-size: 13px;
    font-weight: 650;
    color: #111;
    line-height: 1.25;
  }
  .ps-audio-feel {
    font-size: 11px;
    color: #737373;
    margin-top: 2px;
    line-height: 1.3;
  }
  .ps-audio-scrub {
    width: 100%;
    margin-top: 8px;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: #d4d4d4;
    border-radius: 99px;
    outline: none;
    cursor: pointer;
  }
  .ps-audio-scrub::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 99px;
    background: #111;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px #d4d4d4;
  }
  .ps-audio-scrub::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border-radius: 99px;
    background: #111;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px #d4d4d4;
  }
  .ps-audio-swap {
    height: 34px;
    padding: 0 10px;
    border-radius: 10px;
    border: 1px solid #d4d4d4;
    background: #fff;
    font-size: 11px;
    font-weight: 650;
    color: #404040;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 140ms ease-out;
  }
  .ps-audio-time {
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 10px;
    color: #a3a3a3;
    margin-top: 4px;
  }
  .pl-day-pkg {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #f0f0f0;
  }
  .pl-day-pkg .ps-pkg {
    margin: 0 -4px;
    padding: 12px 12px 4px;
    border-radius: 12px;
    border: 1px solid #ebebeb;
  }
  .ps-dock {
    padding: 12px 16px 10px;
    background: #fff;
    border-top: 1px solid #e5e5e5;
  }
  .ps-primary {
    width: 100%;
    height: 52px;
    border: 0;
    border-radius: 14px;
    background: #111;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 140ms ease-out;
  }
  .ps-secondary {
    width: 100%;
    margin-top: 8px;
    height: 40px;
    border: 0;
    background: transparent;
    color: #737373;
    font-size: 13px;
    font-weight: 650;
    cursor: pointer;
    transition: transform 140ms ease-out;
  }

  /* Empty Today */
  .ps-head-empty {
    padding-top: 14px; /* kicker ~10px lower than default head */
  }
  .ps-empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 32px 20px 24px;
    border-top: 1px solid #e5e5e5;
    min-height: 280px;
  }
  .ps-empty-title {
    font-size: 20px;
    font-weight: 650;
    letter-spacing: -0.02em;
    line-height: 1.25;
    margin: 0 0 8px;
    color: #111;
  }
  .ps-empty-body {
    font-size: 14px;
    line-height: 1.45;
    color: #737373;
    margin: 0;
    max-width: 34ch;
  }
  .ps-dock-empty {
    display: flex;
    justify-content: center;
    border-top: 0;
    background: transparent;
    padding: 8px 28px 18px;
  }
  .ps-dock-empty .ps-primary {
    width: auto;
    min-width: 220px;
    max-width: 100%;
    padding: 0 28px;
  }

  .harness-toggle {
    pointer-events: auto;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.72);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 999px;
    cursor: pointer;
  }
  .harness-toggle[data-on] {
    background: rgba(255,255,255,0.14);
    color: #fff;
    border-color: rgba(255,255,255,0.32);
  }

  /* ——— Archive ——— */
  .ar-head { padding: 4px 20px 12px; }
  .ar-title {
    font-size: 28px;
    font-weight: 650;
    letter-spacing: -0.03em;
    margin: 0 0 4px;
  }
  .ar-sub {
    font-size: 13px;
    color: #737373;
    margin: 0;
  }
  .ar-filters {
    display: flex;
    gap: 8px;
    padding: 0 20px 14px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .ar-filters::-webkit-scrollbar { display: none; }
  .ar-filter {
    flex: 0 0 auto;
    height: 32px;
    padding: 0 12px;
    border-radius: 999px;
    border: 1px solid #e5e5e5;
    background: #fff;
    color: #404040;
    font-size: 12px;
    font-weight: 650;
    cursor: pointer;
    transition: transform 140ms ease-out, background 140ms ease-out, color 140ms ease-out, border-color 140ms ease-out;
  }
  .ar-filter[data-on] {
    background: #111;
    border-color: #111;
    color: #fff;
  }
  .ar-list { border-top: 1px solid #e5e5e5; }
  .ar-row {
    display: grid;
    grid-template-columns: 56px 1fr 56px;
    gap: 12px;
    align-items: center;
    padding: 14px 20px;
    border-bottom: 1px solid #e5e5e5;
    cursor: pointer;
    width: 100%;
    text-align: left;
    background: transparent;
    border-left: 0;
    border-right: 0;
    border-top: 0;
    font: inherit;
    color: inherit;
  }
  .ar-row:active { background: #f5f5f5; }
  .ar-day {
    font-size: 14px;
    font-weight: 650;
  }
  .ar-date {
    font-size: 11px;
    color: #737373;
    margin-top: 2px;
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  .ar-card {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .ar-out {
    font-size: 12px;
    color: #525252;
    margin-top: 3px;
  }
  .ar-out[data-soft] { color: #a3a3a3; }
  .ar-thumb {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    overflow: hidden;
    background: #e5e5e5;
  }
  .ar-thumb svg { width: 100%; height: 100%; display: block; }
  .ar-empty {
    padding: 48px 24px;
    text-align: center;
    color: #737373;
    font-size: 14px;
  }

  /* Archive detail sheet */
  .sheet {
    position: absolute;
    inset: 0;
    z-index: 30;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    background: rgba(0,0,0,0.28);
    opacity: 0;
    pointer-events: none;
    transition: opacity 180ms ease-out;
  }
  .sheet[data-open] {
    opacity: 1;
    pointer-events: auto;
  }
  .sheet-panel {
    background: #fafafa;
    border-radius: 24px 24px 0 0;
    padding: 10px 20px 28px;
    transform: translateY(12px);
    transition: transform 220ms cubic-bezier(0.23, 1, 0.32, 1);
  }
  .sheet[data-open] .sheet-panel { transform: none; }
  .sheet-handle {
    width: 36px;
    height: 4px;
    border-radius: 99px;
    background: #d4d4d4;
    margin: 4px auto 16px;
  }
  .sheet-meta {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #737373;
    margin-bottom: 6px;
  }
  .sheet-title {
    font-size: 22px;
    font-weight: 650;
    letter-spacing: -0.02em;
    margin: 0 0 14px;
    line-height: 1.2;
  }
  .sheet-chip {
    display: inline-flex;
    align-items: center;
    height: 28px;
    padding: 0 10px;
    border-radius: 999px;
    border: 1px solid #e5e5e5;
    background: #fff;
    font-size: 12px;
    font-weight: 650;
    margin-bottom: 12px;
  }
  .sheet-body {
    font-size: 14px;
    line-height: 1.45;
    color: #404040;
    margin: 0 0 8px;
  }
  .sheet-note {
    font-size: 12px;
    color: #737373;
    margin: 0 0 18px;
  }
  .sheet-done {
    width: 100%;
    height: 48px;
    border: 0;
    border-radius: 14px;
    background: #111;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 140ms ease-out;
  }

  /* ——— Plan hub ——— */
  .pl-head { padding: 4px 20px 8px; }
  .pl-title {
    font-size: 28px;
    font-weight: 650;
    letter-spacing: -0.03em;
    margin: 0;
  }
  .pl-cal {
    margin: 0 16px 12px;
    padding: 12px 12px 10px;
    border: 1px solid #e5e5e5;
    border-radius: 16px;
    background: #fff;
  }
  .pl-cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    padding: 0 4px;
  }
  .pl-cal-month {
    font-size: 14px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  .pl-cal-btn {
    width: 32px;
    height: 32px;
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    background: #fafafa;
    font-size: 16px;
    color: #404040;
    cursor: pointer;
    transition: transform 140ms ease-out;
  }
  .pl-cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    text-align: center;
  }
  .pl-cal-dow {
    font-size: 10px;
    font-weight: 700;
    color: #a3a3a3;
    padding: 4px 0 6px;
    letter-spacing: 0.02em;
  }
  .pl-cal-day {
    aspect-ratio: 1;
    border: 0;
    border-radius: 10px;
    background: transparent;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: #404040;
    cursor: pointer;
    position: relative;
    transition: background 140ms ease-out, color 140ms ease-out;
  }
  .pl-cal-day[data-muted] { color: #d4d4d4; pointer-events: none; }
  .pl-cal-day[data-sel] { background: #111; color: #fff; }
  .pl-cal-day:not([data-sel]):active { background: #f5f5f5; }
  .pl-cal-day[data-today]:not([data-sel]) { outline: 1px solid #d4d4d4; outline-offset: -1px; }
  .pl-cal-dot {
    position: absolute;
    left: 50%;
    bottom: 3px;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    border-radius: 99px;
    background: #a3a3a3;
  }
  .pl-cal-day[data-sel] .pl-cal-dot { background: #fff; }
  .pl-cal-day[data-status="ready"] .pl-cal-dot,
  .pl-cal-day[data-status="approved"] .pl-cal-dot { background: #111; }
  .pl-cal-day[data-sel][data-status="ready"] .pl-cal-dot,
  .pl-cal-day[data-sel][data-status="approved"] .pl-cal-dot { background: #fff; }
  .pl-cal-day[data-status="draft"] .pl-cal-dot { background: #d4d4d4; }

  .pl-strip {
    margin: 0 16px 12px;
    padding: 14px 16px;
    border: 1px solid #e5e5e5;
    border-radius: 16px;
    background: #fff;
  }
  .pl-strip-k {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #a3a3a3;
    margin-bottom: 4px;
  }
  .pl-strip-t {
    font-size: 15px;
    font-weight: 650;
    letter-spacing: -0.01em;
    margin-bottom: 4px;
    line-height: 1.25;
  }
  .pl-strip-s {
    font-size: 12px;
    color: #737373;
    margin-bottom: 12px;
    line-height: 1.35;
  }
  .pl-strip-row {
    display: flex;
    gap: 8px;
  }
  .pl-btn {
    flex: 1;
    height: 44px;
    border-radius: 12px;
    border: 1px solid #d4d4d4;
    background: #fff;
    font: inherit;
    font-size: 14px;
    font-weight: 650;
    color: #111;
    cursor: pointer;
    transition: transform 140ms ease-out;
  }
  .pl-btn[data-primary] {
    background: #111;
    border-color: #111;
    color: #fff;
  }
  .pl-btn:disabled { opacity: 0.4; cursor: default; }

  .pl-acc {
    margin: 0 16px 10px;
    border: 1px solid #e5e5e5;
    border-radius: 16px;
    background: #fff;
    overflow: hidden;
  }
  .pl-acc-h {
    width: 100%;

function formatAudioTime(sec) {
  if (!Number.isFinite(sec) || sec < 0) return "0:00";
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2, "0")}`;
}

function stopAudioPlayback() {
  if (media.raf) cancelAnimationFrame(media.raf);
  media.raf = null;
  media.el.pause();
  state.audioPlaying = null;
}

function syncAudioScrub(kind) {
  const scrub = document.getElementById(`${kind}-scrub`);
  const timeEl = document.getElementById(`${kind}-time`);
  if (!scrub || !media.el.duration) return;
  const pct = (media.el.currentTime / media.el.duration) * 100;
  scrub.value = String(pct);
  if (timeEl) {
    timeEl.textContent = `${formatAudioTime(media.el.currentTime)} / ${formatAudioTime(media.el.duration)}`;
  }
}

function startAudioProgress(kind) {
  if (media.raf) cancelAnimationFrame(media.raf);
  const tick = () => {
    if (state.audioPlaying === kind && !media.el.paused) {
      syncAudioScrub(kind);
      media.raf = requestAnimationFrame(tick);
    }
  };
  media.raf = requestAnimationFrame(tick);
}

function toggleAudio() {
  const tracks = BG_TRACKS;
  const idx = state.audioBgIdx;
  const track = tracks[idx];
  const kind = "bg";
  if (state.audioPlaying === kind && !media.el.paused) {
    media.el.pause();
    state.audioPlaying = null;
    if (media.raf) cancelAnimationFrame(media.raf);
    render();
    return;
  }
  stopAudioPlayback();
  media.kind = kind;
  media.el.src = track.url;
  media.el.onended = () => {
    state.audioPlaying = null;
    if (media.raf) cancelAnimationFrame(media.raf);
    render();
  };
  media.el.play().catch(() => showToast("Could not play preview"));
  state.audioPlaying = kind;
  render();
  startAudioProgress(kind);
}

function seekAudio(pct) {
  const tracks = BG_TRACKS;
  const idx = state.audioBgIdx;
  const track = tracks[idx];
  const kind = "bg";
  const target = (Number(pct) / 100) * (media.el.duration || track.duration);
  if (state.audioPlaying !== kind) {
    stopAudioPlayback();
    media.kind = kind;
    media.el.src = track.url;
    state.audioPlaying = kind;
    media.el.onended = () => {
      state.audioPlaying = null;
      if (media.raf) cancelAnimationFrame(media.raf);
      render();
    };
  }
  media.el.currentTime = target;
  syncAudioScrub(kind);
  if (media.el.paused) {
    media.el.play().catch(() => {});
    startAudioProgress(kind);
    render();
  }
}

function writeUrlState() {

function persistPlanDays() {
  try {
    localStorage.setItem(PLAN_DAYS_STORAGE_KEY, JSON.stringify(PLAN_DAYS));
  } catch {}
}

function loadPlanDays() {
  try {
    const raw = localStorage.getItem(PLAN_DAYS_STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (!data || typeof data !== "object" || Array.isArray(data)) return;
    Object.entries(data).forEach(([iso, meta]) => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(iso) || !meta || typeof meta !== "object") return;
      const status = ["empty", "draft", "ready", "approved"].includes(meta.status)
        ? meta.status
        : "empty";
      PLAN_DAYS[iso] = {
        status,
        title: typeof meta.title === "string" ? meta.title : null,
      };
    });
  } catch {}
}

function clearPlanPersistence() {
  try { localStorage.removeItem(PLAN_DAYS_STORAGE_KEY); } catch {}
}

function persistDayGeneration(record) {

function readDayGeneration() {
  try {
    const raw = localStorage.getItem(DAY_GENERATION_STORAGE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || data.status !== "generating" || !/^\d{4}-\d{2}-\d{2}$/.test(data.date)) return null;
    const startedAt = Number(data.startedAt);
    if (!Number.isFinite(startedAt)) return null;
    return {
      status: "generating",
      date: data.date,
      startedAt,
      title: typeof data.title === "string" ? data.title : null,
    };
  } catch {
    return null;
  }
}

}

    state.planCategories = data.categories ?? [];
    state.planCategoryOther = data.categoryOther ?? "";
    state.voiceDeferred = !!data.voiceDeferred;
    state.onboardingFromOnboarding = true;
    if (Array.isArray(data.refs)) {
      state.refs = data.refs.map(r => ({ ...r }));
    }
  } catch {}

function planRefFromOnboardingRef(r, index) {
  const digits = String(r.id || "").replace(/\D/g, "") || String(Date.now() + index);
  const type = r.type === "profile" ? "account" : r.type;
  const status = r.status || (type === "account" ? "account" : "confirmed");
  return { ...r, id: `r${digits}`, type, status };
}

function applyOnboardingRefsToPlan(source) {
  const src = source ?? state.onboardingRefs;
  if (!src?.length) return false;
  state.refs = src.map(planRefFromOnboardingRef);
  return true;
}

function ensurePlanRefsHydrated() {
  if (state.refs.length > 0) return;

  if (applyOnboardingRefsToPlan()) {
    persistOnboardingData();
    return;
  }

  try {
    const prog = localStorage.getItem(ONBOARDING_STORAGE_KEY);
    if (prog) {
      const data = JSON.parse(prog);
      if (Array.isArray(data.refs) && data.refs.length > 0) {
        applyOnboardingRefsToPlan(data.refs);
        persistOnboardingData();
      }
    }
  } catch {}
}

function persistOnboardingData() {
  if (!onboardingIsDone()) return;
  try {
    const raw = localStorage.getItem(ONBOARDING_DATA_KEY);
    const data = raw ? JSON.parse(raw) : {};
    localStorage.setItem(ONBOARDING_DATA_KEY, JSON.stringify({
      ...data,
      categories: state.planCategories,
      categoryOther: state.planCategoryOther,
      refs: state.refs,
      voiceDeferred: state.voiceDeferred,
    }));
  } catch {}
}

  if (onboardingProfileCount() < 1) missing.push("profile");

function onboardingRefAttention() {
  const pending = state.onboardingRefValidation || {};
  const missing = onboardingRefMissingTypes();
  const profile = !!pending.profile && missing.includes("profile");
  const reel = !!pending.reel && missing.includes("reel");
  return {
    profile,
    reel,
    motion: !!pending.motion && (profile || reel),
  };
}

  if (attn.profile) missing.push("profile @handle");

const IG_RESERVED = new Set([
  "about", "accounts", "audio", "developer", "direct", "explore",
  "p", "reel", "reels", "stories", "tv", "music",
]);
const PROFILE_VERIFICATION_STATUS = Object.freeze({
  VERIFIED: "verified",
  NOT_FOUND: "not_found",
  TEMPORARILY_UNAVAILABLE: "temporarily_unavailable",
});
const PROFILE_VERIFICATION_STATUSES = new Set(Object.values(PROFILE_VERIFICATION_STATUS));

function parseInstagramURL(value) {
  const trimmed = value.trim();
  if (!trimmed) return null;
  const urlish = /^https?:\/\//i.test(trimmed) ? trimmed : `https://${trimmed.replace(/^\/+/, "")}`;
  try {
    return new URL(urlish);
  } catch {
    return null;
  }
}

function normalizeInstagramURL(value) {
  const url = parseInstagramURL(value);
  if (!url) return null;
  url.hostname = url.hostname.toLowerCase();
  url.hash = "";
  for (const key of [...url.searchParams.keys()]) {
    const lower = key.toLowerCase();
    if (lower === "igshid" || lower === "fbclid" || lower.startsWith("utm_")) {
      url.searchParams.delete(key);
    }
  }
  url.pathname = url.pathname.replace(/\/+$/g, "");
  return url.toString().replace(/\/$/g, "");
}

function instagramPathSegments(url) {
  return url.pathname.split("/").map(s => s.trim()).filter(Boolean).map(s => decodeURIComponent(s));
}

function normalizePlainHandle(value) {
  const handle = value.trim().replace(/^@+/, "").replace(/\/+$/g, "").toLowerCase();
  if (!/^[a-z0-9._]{2,30}$/.test(handle)) return null;
  if (!/[a-z]/.test(handle)) return null;
  if (IG_RESERVED.has(handle)) return null;
  return handle;
}

function instagramProfileURL(handle) {
  return `https://www.instagram.com/${handle}/`;
}

function classifyInstagramURL(value) {
  const normalized = normalizeInstagramURL(value) ?? value.trim();
  const url = parseInstagramURL(normalized);
  if (!url) return { kind: "malformed", url: value.trim() };
  if (!IG_HOSTS.has(url.hostname.toLowerCase())) {
    return { kind: "non_instagram", url: normalized };
  }

  const segments = instagramPathSegments(url);
  if (!segments.length) return { kind: "malformed", url: normalized };

  if (segments[0].toLowerCase() === "stories") {
    return { kind: "story", url: normalized, reason: "Story links can't be used as references." };
  }

  if (segments.some(s => s.toLowerCase() === "audio" || s.toLowerCase() === "music")) {
    return { kind: "audio", url: normalized };
  }

  for (let i = 0; i < segments.length - 1; i += 1) {
    const seg = segments[i].toLowerCase();
    if (seg === "reel" || seg === "reels" || seg === "p") {
      const shortcode = segments[i + 1];
      if (!shortcode || IG_RESERVED.has(shortcode.toLowerCase())) {
        return { kind: "malformed", url: normalized };
      }
      return {
        kind: seg === "p" ? "post" : "reel",
        url: normalized,
        shortcode,
        key: `instagram:${seg === "p" ? "post" : "reel"}:${shortcode}`,
      };
    }
  }

  if (segments.length === 1) {
    const handle = normalizePlainHandle(segments[0]);
    if (handle) {
      return {
        kind: "profile",
        url: instagramProfileURL(handle),
        handle,
        key: `handle:${handle}`,
      };
    }
  }

  return { kind: "malformed", url: normalized };
}

function buildOnboardingReelRef(classification) {
  const short = classification.url.replace(/^https?:\/\/(www\.)?instagram\.com/i, "instagram.com");
  return {
    type: "reel",
    label: short.length > 46 ? `${short.slice(0, 43)}…` : short,
    status: "confirmed",
    key: classification.key,
    url: classification.url,
  };
}

function buildOnboardingProfileRef(handle, url) {
  return {
    type: "account",
    label: `@${handle} · profile`,
    status: "account",
    key: `handle:${handle}`,
    url,
  };
}

function parseOnboardingRefInput(text, expectedKind) {
  const trimmed = text.trim();
  if (!trimmed) return { ok: false, error: "Paste a reel URL or @handle" };

  const asURL = /instagram\.com|https?:\/\//i.test(trimmed);
  if (asURL) {
    const c = classifyInstagramURL(trimmed);
    if (c.kind === "non_instagram") {
      return { ok: false, error: "Paste an Instagram link — instagram.com/reel/… or instagram.com/handle" };
    }
    if (c.kind === "story") return { ok: false, error: c.reason };
    if (c.kind === "audio") return { ok: false, error: "Audio links aren't supported — paste a reel or profile." };
    if (c.kind === "malformed") {
      return { ok: false, error: expectedKind === "reel"
        ? "That doesn't look like a reel — try instagram.com/reel/…"
        : "That doesn't look like a profile — try @handle or instagram.com/handle" };
    }
    if (c.kind === "reel" || c.kind === "post") {
      if (expectedKind === "profile") {
        return { ok: false, error: "That's a reel link — switch to Reel URL or paste a profile @handle." };
      }
      return { ok: true, ref: buildOnboardingReelRef(c) };
    }
    if (c.kind === "profile") {
      if (expectedKind === "reel") {
        return { ok: false, error: "That's a profile link — switch to Profile @handle or paste a reel URL." };
      }
      return {
        ok: true,
        needsLookup: true,
        handle: c.handle,
        ref: buildOnboardingProfileRef(c.handle, c.url),
      };
    }
  }

  const handle = normalizePlainHandle(trimmed);
  if (!handle) {
    return {
      ok: false,
      error: expectedKind === "reel"
        ? "Paste a full reel URL — e.g. instagram.com/reel/…"
        : "Enter a valid @handle — letters, numbers, dots, underscores (2–30 chars).",
    };
  }
  if (expectedKind === "reel") {
    return { ok: false, error: "Handles are for profiles — paste a reel URL or switch to Profile @handle." };
  }
  return {
    ok: true,
    needsLookup: true,
    handle,
    ref: buildOnboardingProfileRef(handle, instagramProfileURL(handle)),
  };
}

function parsePlanRefInput(text) {
  const trimmed = text.trim();
  if (!trimmed) return { ok: false, error: "Paste a reel URL or @handle" };

  if (/instagram\.com|https?:\/\//i.test(trimmed)) {
    const c = classifyInstagramURL(trimmed);
    if (c.kind === "non_instagram") {
      return { ok: false, error: "Paste an Instagram link — instagram.com/reel/… or instagram.com/handle" };
    }
    if (c.kind === "story") return { ok: false, error: c.reason };
    if (c.kind === "audio") return { ok: false, error: "Audio links aren't supported — paste a reel or profile." };
    if (c.kind === "malformed") {
      return { ok: false, error: "That doesn't look like a valid Instagram reel or profile link." };
    }
    if (c.kind === "reel" || c.kind === "post") {
      return { ok: true, ref: buildOnboardingReelRef(c) };
    }
    if (c.kind === "profile") {
      return {
        ok: true,
        needsLookup: true,
        handle: c.handle,
        ref: buildOnboardingProfileRef(c.handle, c.url),
      };
    }
  }

  const handle = normalizePlainHandle(trimmed);
  if (!handle) {
    return { ok: false, error: "Enter a reel URL or a valid @handle." };
  }
  return {
    ok: true,
    needsLookup: true,
    handle,
    ref: buildOnboardingProfileRef(handle, instagramProfileURL(handle)),
  };
}

function profileVerificationStatusForPrototype(handle) {
  const params = new URLSearchParams(location.search);
  const target = normalizePlainHandle(params.get("profileVerificationHandle") || "");
  if (target && target !== handle) return PROFILE_VERIFICATION_STATUS.VERIFIED;

  // The prototype has no authenticated same-origin import-references client.
  // Keep outcomes deterministic until the host supplies that adapter.
  const configured = (params.get("profileVerification") || "").trim().toLowerCase();
  if (PROFILE_VERIFICATION_STATUSES.has(configured)) return configured;

  // Preserve the existing targeted fixture used by the prototype harness.
  const ig404 = (params.get("ig404") || "").trim().toLowerCase();
  if (ig404 && ig404 === handle) return PROFILE_VERIFICATION_STATUS.NOT_FOUND;

  return PROFILE_VERIFICATION_STATUS.VERIFIED;
}

function profileVerificationResult(handle, status, diagnosticReason) {
  const url = instagramProfileURL(handle);
  const result = {
    status,
    url,
    handle,
    diagnosticReason,
  };
  if (status !== PROFILE_VERIFICATION_STATUS.VERIFIED) {
    // Do not include the handle. Diagnostics need the failure reason, not user input.
    console.debug("[profile-verification]", {
      status: result.status,
      reason: result.diagnosticReason,
    });
  }
  return result;
}

async function verifyInstagramProfile(handle) {
  const status = profileVerificationStatusForPrototype(handle);
  const reasons = {
    [PROFILE_VERIFICATION_STATUS.VERIFIED]: "prototype_fixture_verified",
    [PROFILE_VERIFICATION_STATUS.NOT_FOUND]: "prototype_fixture_not_found",
    [PROFILE_VERIFICATION_STATUS.TEMPORARILY_UNAVAILABLE]: "prototype_fixture_temporarily_unavailable",
  };
  return profileVerificationResult(handle, status, reasons[status]);
}

function onboardingRefsMixHint() {
  const n = state.onboardingRefs.length;
  if (n < 2 || onboardingRefsValid()) return "";
  const reels = onboardingReelCount();
  const profiles = onboardingProfileCount();
  if (reels === 0 && profiles >= 2) {
    return "You have profiles only — add at least one reel URL (use Reel URL and paste instagram.com/reel/…).";
  }
  if (profiles === 0 && reels >= 2) {
    return "You have reels only — add at least one profile (use Profile @handle and paste @creator).";
  }
  if (reels === 0) return "Add at least one reel URL to continue.";
  if (profiles === 0) return "Add at least one profile @handle to continue.";
  return "";
}

function setOnboardingRefType(type) {
  state.onboardingRefType = type;
  render();
}

function addOnboardingRef() {
  void addOnboardingRefAsync();
}

async function addOnboardingRefAsync() {
  const text = state.onboardingRefPaste.trim();
  if (!text) {
    showToast("Paste a reel URL or @handle");
    return;
  }
  if (state.onboardingRefValidating) return;

  const parsed = parseOnboardingRefInput(text, state.onboardingRefType);
  if (!parsed.ok) {
    showToast(parsed.error);
    return;
  }

  let ref = parsed.ref;
  let lookup = null;
  if (parsed.needsLookup) {
    state.onboardingRefValidating = true;
    render();
    lookup = await verifyInstagramProfile(parsed.handle);
    state.onboardingRefValidating = false;
    if (lookup.status === PROFILE_VERIFICATION_STATUS.NOT_FOUND) {
      showToast(`@${lookup.handle} wasn't found on Instagram`);
      render();
      return;
    }
    ref = buildOnboardingProfileRef(lookup.handle, lookup.url);
  }

  const dup = state.onboardingRefs.find(r => r.key === ref.key);
  if (dup) {
    showToast("Already added");
    render();
    return;
  }

  state.onboardingRefs.push({ id: `obr${Date.now()}`, ...ref });
  state.onboardingRefPaste = "";
  saveOnboardingProgress();
  if (lookup?.status === PROFILE_VERIFICATION_STATUS.TEMPORARILY_UNAVAILABLE) {
    showToast("Profile added. We couldn't check Instagram right now.");
  } else {
    showToast(ref.type === "account" ? "Profile added" : "Reel added");
  }
  render();
}

function removeOnboardingRef(id) {
  state.onboardingRefs = state.onboardingRefs.filter(r => r.id !== id);
  saveOnboardingProgress();
  render();
}

function advanceOnboardingFromCategories() {
  if (!onboardingCategoriesValid()) {
    if (state.onboardingCategories.includes(ONBOARDING_CATEGORY_OTHER_ID) && !state.onboardingCategoryOther.trim()) {
      showToast("Enter your category");
    }
    return;
  }
  state.onboardingStep = 1;
  saveOnboardingProgress();
  render();
}

function advanceOnboardingFromRefs() {
  if (!onboardingRefsValid()) {
    const missing = onboardingRefMissingTypes();
    state.onboardingRefValidation = {
      reel: missing.includes("reel"),
      profile: missing.includes("profile"),
      motion: onboardingRefMotionEnabled(),
    };
    if (missing.length === 1 || !missing.includes(state.onboardingRefType)) {
      state.onboardingRefType = missing[0] || state.onboardingRefType;
    }
    const message = onboardingRefValidationMessage();
    showToast(message || "Add at least one reel URL and one profile @handle to continue.");
    render();
    focusOnboardingRefValidationTarget();
    return;
  }
  state.onboardingRefValidation = { reel: false, profile: false, motion: false };
  state.onboardingStep = 2;
  saveOnboardingProgress();
  render();
}

function goToOnboardingStep(step) {
  state.onboardingStep = step;
  saveOnboardingProgress();
  render();
}

function softSkipOnboarding() {
  saveOnboardingProgress();
  state.onboardingDismissed = true;
  state.tab = "today";
  state.empty = true;
  writeUrlState();
  showToast("Set up later — we'll ask again next launch");
  render();
}

function finishOnboardingAndGenerate() {
  if (state.generating) return;
  const today = selectLocalToday();
  const existingDay = PLAN_DAYS[today];
  if (existingDay?.status === "ready" || existingDay?.status === "approved") return;
  applyOnboardingRefsToPlan();
  state.planCategories = [...state.onboardingCategories];
  state.planCategoryOther = state.onboardingCategoryOther;
  state.onboardingComplete = true;
  state.onboardingFromOnboarding = true;
  state.voiceDeferred = true;
  state.first = false;
  state.empty = true;
  state.tab = "plan";
  state.planVoiceOpen = false;
  state.planRefsOpen = false;
  state.planCategoriesOpen = false;
  state.planFocus = null;
  state.daygenOpen = false;
  state.selectedIdeaIndex = null;
  state.daygenSteerText = "";
  state.regenChangeText = "";
  state.selectedPrompt = null;
  try {
    localStorage.setItem(ONBOARDING_DONE_KEY, "1");
    localStorage.setItem(ONBOARDING_DATA_KEY, JSON.stringify({
      categories: state.planCategories,
      categoryOther: state.planCategoryOther,
      refs: state.refs,
      voiceDeferred: true,
    }));
    clearOnboardingProgress();
  } catch {}
  writeUrlState();
  startGenerate({ date: today, firstDay: true });
}

function renderOnboarding() {
  const step = state.onboardingStep;
  let body = "";
  let dock = "";

  if (step === 0) {
    body = `
      <div class="ob-content">
        <p class="ob-hint" style="margin-top:0">Pick 1–3</p>
        <div class="ob-chip-grid">
          ${ONBOARDING_CATEGORIES.map(c => `
            <button type="button" class="ob-chip press" ${state.onboardingCategories.includes(c.id) ? "data-sel" : ""} onclick="toggleOnboardingCategory('${c.id}')">${esc(c.label)}</button>
          `).join("")}
          <button type="button" class="ob-chip press" ${state.onboardingCategories.includes(ONBOARDING_CATEGORY_OTHER_ID) ? "data-sel" : ""} onclick="toggleOnboardingCategory('${ONBOARDING_CATEGORY_OTHER_ID}')">Other</button>
        </div>
        ${state.onboardingCategories.includes(ONBOARDING_CATEGORY_OTHER_ID) ? `
          <input type="text" class="ob-other-input" placeholder="Your category…" value="${esc(state.onboardingCategoryOther)}" oninput="updateOnboardingCategoryOther(this.value)" aria-label="Custom category" />` : ""}
      </div>`;
    dock = `
      <button type="button" class="ob-skip-link press" onclick="softSkipOnboarding()">Set up later</button>
      <button type="button" class="ob-primary press" ${state.onboardingCategories.length < 1 ? "disabled" : ""} onclick="advanceOnboardingFromCategories()">Continue</button>`;
  } else if (step === 1) {
    const attn = onboardingRefAttention();
    const attentionMotion = attn.motion;
    if (attentionMotion) state.onboardingRefValidation.motion = false;
    const validationMessage = onboardingRefValidationMessage(attn);
    const mixHint = onboardingRefsMixHint();
    const refHint = validationMessage || mixHint;
    const refHintHtml = refHint
      ? `<p ${validationMessage ? 'id="onboarding-ref-error" role="alert"' : ""} class="ob-hint-warn">${esc(refHint)}</p>`
      : "";
    const refRows = state.onboardingRefs.length
      ? state.onboardingRefs.map(r => `
          <div class="ob-ref-row">
            <span>${r.type === "account" ? "@" : "▶"} ${esc(r.label)}</span>
            <button type="button" class="ob-ref-remove press" onclick="removeOnboardingRef('${r.id}')" aria-label="Remove">×</button>
          </div>`).join("")
      : `<p class="ob-hint" style="margin:0">No references yet.</p>`;
    const profileInputAttn = attn.profile && state.onboardingRefType === "profile";
    const reelInputAttn = attn.reel && state.onboardingRefType === "reel";
    body = `
      <div class="ob-content">
        <div class="ob-type-toggle">
          <button type="button" class="ob-type-btn press" ${state.onboardingRefType === "reel" ? "data-sel" : ""} ${attn.reel ? "data-attn aria-invalid=\"true\"" : ""} ${attn.reel && attentionMotion ? "data-attn-motion" : ""} onclick="setOnboardingRefType('reel')">Reel URL</button>
          <button type="button" class="ob-type-btn press" ${state.onboardingRefType === "profile" ? "data-sel" : ""} ${attn.profile ? "data-attn aria-invalid=\"true\"" : ""} ${attn.profile && attentionMotion ? "data-attn-motion" : ""} onclick="setOnboardingRefType('profile')">Profile @handle</button>
        </div>
        <textarea class="pl-textarea" data-onboarding-ref-input="${state.onboardingRefType}" ${profileInputAttn || reelInputAttn ? "data-attn aria-invalid=\"true\"" : ""} ${profileInputAttn || reelInputAttn ? "aria-describedby=\"onboarding-ref-error\"" : ""} ${((state.onboardingRefType === "profile" && attn.profile) || (state.onboardingRefType === "reel" && attn.reel)) && attentionMotion ? "data-attn-motion" : ""} placeholder="${state.onboardingRefType === "profile" ? "@creator" : "https://instagram.com/reel/…"}" oninput="state.onboardingRefPaste=this.value">${esc(state.onboardingRefPaste)}</textarea>
        <button type="button" class="pl-ref-add press" style="margin-top:8px" ${state.onboardingRefValidating ? "disabled" : ""} onclick="addOnboardingRef()">${state.onboardingRefValidating ? "Checking on Instagram…" : "+ Add reference"}</button>
        <div style="margin-top:14px">${refRows}</div>
        <p class="ob-hint" style="margin-top:12px">${state.onboardingRefs.length}/10 · ${onboardingReelCount()} reel · ${onboardingProfileCount()} profile</p>
        ${refHintHtml}
      </div>`;
    dock = `
      <button type="button" class="ob-skip-link press" onclick="softSkipOnboarding()">Set up later</button>
      <button type="button" class="ob-primary press" onclick="advanceOnboardingFromRefs()">Continue</button>
      <button type="button" class="ob-secondary press" onclick="goToOnboardingStep(0)">Back</button>`;
  } else {
    const catLabels = state.onboardingCategories
      .map(id => onboardingCategoryLabel(id))
      .filter(Boolean);
    body = `
      <div class="ob-content">
        <div class="ob-summary-block">
          <div class="ob-summary-h">
            <span>Categories</span>
            <button type="button" class="ob-edit-link press" onclick="goToOnboardingStep(0)">Edit</button>
          </div>
          <div class="ob-chip-row">${catLabels.map(l => `<span class="ob-chip" data-sel>${esc(l)}</span>`).join("")}</div>
        </div>
        <div class="ob-summary-block">
          <div class="ob-summary-h">
            <span>References (${state.onboardingRefs.length})</span>
            <button type="button" class="ob-edit-link press" onclick="goToOnboardingStep(1)">Edit</button>
          </div>
          ${state.onboardingRefs.map(r => `<div class="ob-ref-row">${r.type === "account" ? "@" : "▶"} ${esc(r.label)}</div>`).join("")}
        </div>
      </div>`;
    dock = `
      <p class="ob-support">We'll draft scenes, caption, and audio in Plan — then Today is ready to shoot.</p>
      <button type="button" class="ob-primary press" onclick="finishOnboardingAndGenerate()">Generate my first day</button>
      <button type="button" class="ob-secondary press" onclick="goToOnboardingStep(1)">Back</button>`;
  }

  const titles = [
    "What do you create about?",
    "Who should we learn from?",
    "Ready to generate?",
  ];
  const bodies = [
    "Pick your content categories — you can always change these later in Plan.",
    "Reels and profiles teach us your aesthetic.",
    "Categories and references only — aesthetic tags come later from analysis.",
  ];

  return `
    ${statusBar()}
    <div class="ob-screen">
      <div class="ob-head">
        <div class="ob-step">Step ${step + 1} of 3</div>
        <h1 class="ob-title">${titles[step]}</h1>
        <p class="ob-body">${bodies[step]}</p>
      </div>
      ${body}
    </div>
    <div class="ob-dock">${dock}</div>`;
}

function goToPlan(focus) {
  state.tab = "plan";
  state.youSubview = null;
  state.youSubviewOrigin = null;
  state.planFocus = null;
  state.archiveDetail = null;
  state.nextScrollTop = 0;
  state.nextWindowScrollY = 0;
  writeUrlState();
  render();
}

function openYouSubview(subview, origin) {
  const valid = ["categories", "voice", "refs", "archive"];
  if (!valid.includes(subview)) return;

  const resolvedOrigin = origin || (state.tab === "plan" ? "plan" : "you");
  const currentScreen = document.querySelector("#app .screen");
  if (resolvedOrigin === "plan") {
    state.planReturnScrollTop = currentScreen?.scrollTop ?? 0;
    state.planReturnWindowScrollY = window.scrollY;
  } else {
    state.youReturnScrollTop = currentScreen?.scrollTop ?? 0;
    state.youReturnWindowScrollY = window.scrollY;
  }

  state.tab = "you";
  state.youSubview = subview;
  state.youSubviewOrigin = resolvedOrigin === "plan" ? "plan" : "you";
  state.archiveDetail = null;
  state.planFocus = null;
  state.nextScrollTop = 0;
  state.nextWindowScrollY = 0;
  writeUrlState();
  render();
}

function closeYouSubview() {
  const fromPlan = state.youSubviewOrigin === "plan";
  const planScrollTop = state.planReturnScrollTop;
  const planWindowScrollY = state.planReturnWindowScrollY;
  const youScrollTop = state.youReturnScrollTop;
  const youWindowScrollY = state.youReturnWindowScrollY;

  state.youSubview = null;
  state.youSubviewOrigin = null;
  state.archiveDetail = null;
  state.planFocus = null;

  if (fromPlan) {
    state.tab = "plan";
    state.nextScrollTop = planScrollTop ?? 0;
    state.nextWindowScrollY = planWindowScrollY ?? 0;
    state.planReturnScrollTop = null;
    state.planReturnWindowScrollY = null;
  } else {
    state.tab = "you";
    state.nextScrollTop = youScrollTop ?? 0;
    state.nextWindowScrollY = youWindowScrollY ?? 0;
    state.youReturnScrollTop = null;
    state.youReturnWindowScrollY = null;
  }

  writeUrlState();
  render();
}

function voiceComplete() {
  return !!(state.voice.positioning.trim() && state.voice.rules.trim());
}

function refsCount() {
  return state.refs.filter(r => r.status === "confirmed").length;
}

function setPlanSelectedDate(iso) {
  const [year, month, day] = String(iso).split("-").map(Number);
  if (![year, month, day].every(Number.isInteger) || month < 1 || month > 12 || day < 1 || day > 31) return false;
  state.planSelected = iso;
  state.planYear = year;
  state.planMonth = month - 1;
  return true;
}

function ensurePlanDay(iso) {
  if (!PLAN_DAYS[iso]) PLAN_DAYS[iso] = { status: "empty", title: null };
  return PLAN_DAYS[iso];
}

function selectLocalToday() {
  const today = localTodayISO();
  ensurePlanDay(today);
  setPlanSelectedDate(today);
  return today;
}

function selectedPlanDay() {
  return PLAN_DAYS[state.planSelected] || { status: "empty", title: null };
}

function formatPlanDate(iso) {
  const d = new Date(iso + "T12:00:00");
  return {
    weekday: d.toLocaleDateString("en-GB", { weekday: "long" }),
    label: d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }),
    short: d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }),
  };
}

function generatedPlanDays() {
  return Object.entries(PLAN_DAYS)
    .filter(([, meta]) => meta.status && meta.status !== "empty")
    .sort(([a], [b]) => a.localeCompare(b))
    .map(([iso, meta]) => ({ iso, ...meta, ...formatPlanDate(iso) }));
}

function renderDaygenPanel() {

          <div class="pl-daygen-idea-t">${esc(p.title)}</div>

function buildCalendarCells() {
  const first = new Date(state.planYear, state.planMonth, 1);
  const startPad = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(state.planYear, state.planMonth + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startPad; i++) cells.push({ muted: true });
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = `${state.planYear}-${String(state.planMonth + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const meta = PLAN_DAYS[iso];
    cells.push({
      day: d,
      iso,
      status: meta?.status || "empty",
      today: iso === localTodayISO(),
      selected: iso === state.planSelected,
    });
  }
  return cells;
}

function normalizeImportKey(text) {
  const t = text.trim();
  if (t.startsWith("@")) return `handle:${t.replace(/^@/, "").toLowerCase()}`;
  if (t.includes("audio")) return `audio:${t.toLowerCase()}`;
  try {
    const url = new URL(t.includes("://") ? t : `https://${t}`);
    return `url:${url.hostname}${url.pathname}`.toLowerCase();
  } catch {
    return `raw:${t.toLowerCase()}`;
  }
}

function findImportDuplicate(text) {
  const key = normalizeImportKey(text);
  const isHandle = text.startsWith("@") || (!text.includes("http") && !text.includes("/"));
  for (const r of state.refs) {
    if (r.key && r.key === key) {
      return { reason: "Already saved — same reference", block: true };
    }
    if (isHandle && r.status === "account" && r.label.toLowerCase().includes(text.replace(/^@/, "").toLowerCase())) {
      return { reason: "Already in Inspiration — same @handle", block: true };
    }
    if (!isHandle && r.status === "confirmed" && r.label.toLowerCase().includes(text.slice(0, 24).toLowerCase())) {
      return { reason: "Likely duplicate — URL matches a saved reel/audio", block: false };
    }
  }
  if (text.includes("checksum-mismatch")) {
    return { reason: "Checksum mismatch — re-paste the original URL", block: true };
  }
  return null;
}

function completeDayGeneration(date, startedAt) {
  const persisted = readDayGeneration();
  if (persisted && (persisted.date !== date || persisted.startedAt !== startedAt)) return;
  dayGenerationTimer = null;
  state.generating = false;
  state.generationDate = null;
  state.generationStartedAt = null;
  const title = state.selectedPrompt?.title || persisted?.title || CARD.title;
  ensurePlanDay(date);
  PLAN_DAYS[date] = { status: "ready", title };
  persistPlanDays();
  clearDayGenerationPersistence();
  state.selectedPrompt = null;
  if (state.sheet === "gen-progress") state.sheet = null;
  // Keep empty=true until Approve — Today must not show the package early (ticket 05).
  if (state.first) state.first = false;
  writeUrlState();
  showToast("Package ready — Approve when happy");
  render();
}

function scheduleDayGenerationCompletion(date, startedAt) {
  clearDayGenerationTimer();
  const elapsed = Date.now() - startedAt;
  const remaining = Math.max(0, DAY_GENERATION_DURATION_MS - elapsed);
  dayGenerationTimer = setTimeout(() => completeDayGeneration(date, startedAt), remaining);
}

function restoreDayGeneration() {
  const record = readDayGeneration();
  if (!record) return;
  ensurePlanDay(record.date);
  setPlanSelectedDate(record.date);
  state.generating = true;
  state.generationDate = record.date;
  state.generationStartedAt = record.startedAt;
  state.selectedPrompt = record.title ? { title: record.title } : null;
  state.sheet = "gen-progress";
  scheduleDayGenerationCompletion(record.date, record.startedAt);
}

function startGenerate(options = {}) {
  if (state.generating) return false;
  const generationDate = options.date || state.planSelected;
  const day = ensurePlanDay(generationDate);
  if (options.firstDay && day.status !== "empty") return false;
  setPlanSelectedDate(generationDate);
  if (state.sheet) closeSheet();
  const startedAt = Date.now();
  state.generating = true;
  state.generationDate = generationDate;
  state.generationStartedAt = startedAt;
  if (options.prompt) state.selectedPrompt = options.prompt;
  persistDayGeneration({
    status: "generating",
    date: generationDate,
    startedAt,
    title: state.selectedPrompt?.title || null,
  });
  openSheet("gen-progress");
  scheduleDayGenerationCompletion(generationDate, startedAt);
  return true;
}

async function confirmImportAsync() {

  if (!text) {

  const dup = findImportDuplicate(text);
  if (dup) {

  }
  await finishImport(text);
}

async function finishImport(text) {
  if (state.importValidating) return;

  const parsed = parsePlanRefInput(text);
  if (!parsed.ok) {
    showToast(parsed.error);
    return;
  }

  let ref = parsed.ref;

  let lookup = null;
  if (parsed.needsLookup) {
    state.importValidating = true;
    render();
    lookup = await verifyInstagramProfile(parsed.handle);
    state.importValidating = false;
    if (lookup.status === PROFILE_VERIFICATION_STATUS.NOT_FOUND) {
      showToast(`@${lookup.handle} wasn't found on Instagram`);
      render();
      return;
    }
    ref = buildOnboardingProfileRef(lookup.handle, lookup.url);
  }

  const dupKey = state.refs.find(r => r.key === ref.key);
  if (dupKey) {
    showToast("Already added");
    render();
    return;
  }

  state.refs.push({ id: `r${Date.now()}`, ...ref });
  closeSheet();
  if (lookup?.status === PROFILE_VERIFICATION_STATUS.TEMPORARILY_UNAVAILABLE) {
    showToast("Profile added. We couldn't check Instagram right now.");
  } else {
    showToast(ref.type === "account" ? "Account added to Inspiration" : "Reference confirmed");
  }
  persistOnboardingData();
  render();
}

        </div>
      </div>`;
  } else if (s === "import-preview") {
    const prev = state.importPreview || {};
    const block = prev.block;
    inner = `
      <div class="sheet-meta">Import preview</div>
      <h2 class="sheet-title">${block ? "Can't add this reference" : "Possible duplicate"}</h2>
      <p class="sheet-body">${esc(prev.reason || "This looks like something you already saved.")}</p>
      <p class="sheet-note" style="margin-top:8px">Paste: <strong>${esc(prev.text || "")}</strong></p>
      <div class="lsheet-actions" style="margin-top:14px">
        ${block
          ? `<button type="button" class="sheet-done press" onclick="closeSheet()">OK</button>`
          : `<button type="button" class="sheet-done press" onclick="confirmImportAnyway()">Add anyway</button>
             <button type="button" class="lsheet-secondary press" onclick="closeSheet()">Cancel</button>`}
      </div>`;
  } else if (s === "review-edit") {
    inner = `
      <div class="sheet-meta">Needs your call</div>
      <h2 class="sheet-title">Edit before approve</h2>
      <p class="sheet-note" style="margin-bottom:12px">Fix the label or URL, then save — approve from the list when ready.</p>
      <textarea class="pl-textarea" placeholder="Reel URL or short label" oninput="state.importPaste=this.value">${esc(state.importPaste)}</textarea>
      <div class="lsheet-actions" style="margin-top:14px">
        <button type="button" class="sheet-done press" onclick="saveReviewEdit()">Save</button>
        <button type="button" class="lsheet-secondary press" onclick="closeSheet()">Cancel</button>
      </div>`;
  } else if (s === "import") {
    inner = `
      <div class="sheet-meta">Add reference</div>
      <h2 class="sheet-title">Paste reel or @handle</h2>
      <p class="sheet-note" style="margin-bottom:12px">Reel/audio URLs count toward generation. Handles land in Inspiration.</p>
      <textarea class="pl-textarea" placeholder="https://instagram.com/reel/… or @creator" oninput="state.importPaste=this.value">${esc(state.importPaste)}</textarea>
      <div class="lsheet-actions" style="margin-top:14px">
        <button type="button" class="sheet-done press" ${state.importValidating ? "disabled" : ""} onclick="confirmImport()">${state.importValidating ? "Checking…" : "Add"}</button>
        <button type="button" class="lsheet-secondary press" onclick="closeSheet()">Cancel</button>
      </div>`;
  } else if (s === "voice-qa") {
    const step = VOICE_QA_STEPS[state.voiceQaStep];
    const draftVal = state.voiceQaDraft[step.field] || "";
    const skipBtn = step.optional
      ? `<button type="button" class="lsheet-secondary press" onclick="skipVoiceQaStep()">Skip</button>`
      : "";
    inner = `
      <div class="sheet-meta">Guided voice · ${state.voiceQaStep + 1}/${VOICE_QA_STEPS.length}</div>
      <h2 class="sheet-title">${esc(step.question)}</h2>
      <p class="sheet-note" style="margin-bottom:12px">${esc(step.hint)}</p>
      <textarea class="pl-textarea" id="voice-qa-input" placeholder="${esc(step.placeholder)}" oninput="state.voiceQaDraft['${step.field}']=this.value">${esc(draftVal)}</textarea>
      <div class="lsheet-actions" style="margin-top:14px">
        <button type="button" class="sheet-done press" onclick="voiceQaAnswer(document.getElementById('voice-qa-input').value)">${state.voiceQaStep < VOICE_QA_STEPS.length - 1 ? "Next" : "Finish"}</button>
        ${skipBtn}
        <button type="button" class="lsheet-secondary press" onclick="closeSheet()">Cancel</button>
      </div>`;
  }
  return `
    <div class="sheet" data-open onclick="if(event.target===this) closeSheet()">
      <div class="sheet-panel${s === "account" ? " sheet-panel-sm" : ""}" role="dialog" aria-modal="true">
        <div class="sheet-handle"></div>
        ${inner}
      </div>
    </div>`;
}

  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

  if (status === "approved") return "Approved · on Today";

  return "No content planned for today";
}

    ? entries.map(e => `

  if (confirmedList.length) {

  const day = selectedPlanDay();

  const genDays = generatedPlanDays();

  const scenePreview = hasPackage
    ? `<div class="pl-day-title">${esc(day.title || "Untitled package")}</div>
       <div class="pl-day-scenes">
         ${CARD.scenes.map(s => `
           <div class="pl-day-scene"><span>${esc(s.title)}</span><span>${s.duration}</span></div>

       ${renderExecutionPackageBlock(true)}`
    : "";
  const daygenPanel = renderDaygenPanel();

  let planCtas = "";
  if (day.status === "approved") {
    planCtas = `<div class="pl-cta-row">
      <button type="button" class="pl-btn press" style="flex:1" disabled>Approved · on Today</button>
      <button type="button" class="pl-btn press" ${state.generating ? "disabled" : ""} onclick="requestGenerate()">Regenerate</button>
    </div>`;
  } else if (hasPackage) {
    const canApprove = day.status === "ready";
    planCtas = `<div class="pl-cta-row">
      <button type="button" class="pl-btn press" ${canApprove ? "data-primary" : ""} ${canApprove ? "" : "disabled"} onclick="approveDay()">Approve</button>
      <button type="button" class="pl-btn press" ${state.generating ? "disabled" : ""} onclick="requestGenerate()">Regenerate</button>
    </div>`;
  }

  const genList = genDays.length
    ? genDays.map(g => `
        <button type="button" class="pl-gen-row press" ${g.iso === state.planSelected ? "data-sel" : ""} onclick="selectPlanDay('${g.iso}')">
          <div>
            <div class="pl-gen-row-t">${esc(g.title || "Untitled")}</div>
            <div class="pl-gen-row-s">${g.short}</div>
          </div>
          <span class="pl-gen-row-chip">${g.status}</span>
        </button>`).join("")
    : "";

  const genBlock = genDays.length
    ? `<div class="pl-gen-block">
        <div class="pl-gen-k">Days with content</div>
        ${genList}
      </div>`
    : "";

  return `
    ${statusBar()}
    <div class="screen">
      <div class="pl-head">
        <h1 class="pl-title">Plan</h1>
      </div>

      <button type="button" class="pl-date press" onclick="openCalendarSheet()" aria-label="Change selected day">
        <div>
          <span class="pl-date-w">${dateFmt.weekday}</span>
          <span class="pl-date-d">${dateFmt.label}</span>
        </div>
        <span class="pl-date-chev">›</span>
      </button>

      <div class="pl-day-body">
        ${daygenPanel}
        <div class="pl-day-status">${stripStatusLabel(day.status)}</div>
        ${scenePreview}
        ${planCtas}
      </div>

      ${genBlock}

      ${renderPlanGenerationInputs()}
    </div>
    ${tabs()}
    ${renderLightSheet()}`;
}

function setTab(tab) {
  if (needsOnboarding()) return;
  if (tab !== state.tab) stopAudioPlayback();
  state.tab = tab;
  state.archiveDetail = null;
  state.youSubview = null;
  state.youSubviewOrigin = null;
  state.planReturnScrollTop = null;
  state.planReturnWindowScrollY = null;
  state.youReturnScrollTop = null;
  state.youReturnWindowScrollY = null;
  state.nextScrollTop = 0;
  state.nextWindowScrollY = 0;
  writeUrlState();
  render();
}

function render() {
  const app = document.getElementById("app");
  const scrollEl = app.querySelector(".screen, .ob-screen");
  const scrollTop = scrollEl?.scrollTop ?? 0;
  const windowScrollY = window.scrollY;
  const explicitScrollTop = state.nextScrollTop;
  const explicitWindowScrollY = state.nextWindowScrollY;
  state.nextScrollTop = null;
  state.nextWindowScrollY = null;

  const label = document.getElementById("route-label");
  let suffix = "";
  if (needsOnboarding()) suffix = " · onboarding";
  else if (state.tab === "today" && state.empty) suffix = " · empty";
  else if (state.tab === "you" && state.youSubview === "archive") suffix = " · archive";
  label.textContent = (needsOnboarding() ? "Onboarding" : state.tab[0].toUpperCase() + state.tab.slice(1)) + suffix;
  syncHarnessToggles();
  let html = "";
  if (needsOnboarding()) html = renderOnboarding();
  else if (state.tab === "today") html = renderToday();
  else if (state.tab === "you") html = renderYou();
  else html = renderPlan();
  app.innerHTML = html;

  if (state.planFocus) {
    const el = document.querySelector(`[data-focus="${state.planFocus}"]`);
    el?.scrollIntoView?.({ block: "nearest" });
    state.planFocus = null;
  } else {
    const newScrollEl = app.querySelector(".screen, .ob-screen");
    if (newScrollEl) newScrollEl.scrollTop = explicitScrollTop ?? scrollTop;
  }

  window.scrollTo(0, explicitWindowScrollY ?? windowScrollY);
}

document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "1") setTab("today");
  else if (e.key === "2") setTab("plan");
  else if (e.key === "3") setTab("you");
  else if (e.key === "e" || e.key === "E") toggleEmpty();
  else if (e.key === "f" || e.key === "F") toggleFirst();
  else if (e.key === "Escape") {
    if (state.sheet) closeSheet();
    else if (state.archiveDetail) closeArchive();
    else if (state.youSubview) closeYouSubview();
  }
});

const params = new URLSearchParams(location.search);
const initial = (params.get("tab") || "today").toLowerCase();
if (initial === "archive") {
  state.tab = "you";
  state.youSubview = "archive";
  state.youSubviewOrigin = "you";
} else {
  state.tab = ["today", "you", "plan"].includes(initial) ? initial : "today";
  const initialYouSubview = params.get("you");
  if (state.tab === "you" && ["categories", "voice", "refs", "archive"].includes(initialYouSubview)) {
    state.youSubview = initialYouSubview;
    state.youSubviewOrigin = params.get("from") === "plan" ? "plan" : "you";
  }
}
state.empty = ["1", "true", "yes"].includes((params.get("empty") || "").toLowerCase());
state.first = ["1", "true", "yes"].includes((params.get("first") || "").toLowerCase());
if (state.first) {
  state.empty = true;
  resetOnboardingState();
  state.refs = [];
  state.needsReview = [];
  state.voice = { positioning: "", rules: "", pillars: "", captionStyle: "" };
  state.planVoiceOpen = false;
  state.planRefsOpen = false;
  resetPlanForFirstRun();
  try {
    localStorage.removeItem(ONBOARDING_DONE_KEY);
    localStorage.removeItem(ONBOARDING_DATA_KEY);
    clearOnboardingProgress();
    localStorage.removeItem(PLAN_DAYS_STORAGE_KEY);
    localStorage.removeItem(DAY_GENERATION_STORAGE_KEY);
  } catch {}
} else if (onboardingIsDone()) {
  state.onboardingComplete = true;
  loadPlanDays();
  loadOnboardingData();
  ensurePlanRefsHydrated();
  restoreDayGeneration();
} else {
  state.onboardingComplete = false;
  loadOnboardingProgress();
}
if (["1", "true", "yes"].includes((params.get("nocontent") || "").toLowerCase())) {
  resetPlanForFirstRun();
  clearDayGenerationTimer();
  state.generating = false;
  state.generationDate = null;
  state.generationStartedAt = null;
  state.sheet = null;
  clearDayGenerationPersistence();
  clearPlanPersistence();
  state.empty = true;
}
render();
</script>
</body>
</html>
