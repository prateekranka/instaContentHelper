<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE — Content Helper · Pocket Sheet shell</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0c0c0d;
    color: #f4f4f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .harness {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 32px 16px 48px;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, #1a1a1f, transparent),
      #0c0c0d;
  }
  .harness-meta {
    position: fixed;
    top: 16px;
    left: 16px;
    right: 16px;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    pointer-events: none;
    font-size: 12px;
    color: rgba(255,255,255,0.45);
  }
  .harness-meta strong { color: rgba(255,255,255,0.72); font-weight: 600; }
  .phone {
    width: 390px;
    height: 844px;
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.08),
      0 40px 80px rgba(0,0,0,0.55);
    background: #fafafa;
  }
  .phone-notch {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 34px;
    background: #000;
    border-radius: 20px;
    z-index: 5;
    pointer-events: none;
  }
  #app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    color: #111;
    background: #fafafa;
  }
  .sb {
    display: flex;
    justify-content: space-between;
    padding: 16px 28px 8px;
    font-size: 14px;
    font-weight: 600;
  }
  .screen {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .press:active { transform: scale(0.97); }

  .toast {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 96px;
    z-index: 40;
    padding: 12px 14px;
    border-radius: 14px;
    background: rgba(10,10,10,0.88);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: opacity 180ms cubic-bezier(0.23, 1, 0.32, 1), transform 180ms cubic-bezier(0.23, 1, 0.32, 1);
  }
  .toast[data-show] { opacity: 1; transform: none; }

  /* Shared tab bar */
  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0;
    padding: 8px 8px 14px;
    background: #fafafa;
    border-top: 1px solid #e5e5e5;
  }
  .tab {
    border: 0;
    background: transparent;
    font: inherit;
    font-size: 11px;
    font-weight: 650;
    color: #a3a3a3;
    padding: 8px;
    cursor: pointer;
    transition: color 140ms ease-out, transform 140ms ease-out;
  }
  .tab[data-on] { color: #111; }
  .tab:active { transform: scale(0.97); }

  /* ——— Today / Pocket Sheet ——— */
  .ps-head { padding: 4px 20px 12px; }
  .ps-kicker {
    font-size: 12px;
    font-weight: 600;
    color: #737373;
    margin-bottom: 6px;
  }
  .ps-title {
    font-size: 20px;
    font-weight: 650;
    letter-spacing: -0.02em;
    line-height: 1.25;
    margin: 0;
  }
  .ps-rail {
    display: flex;
    gap: 8px;
    padding: 0 20px 12px;
  }
  .ps-pill {
    font-size: 12px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 999px;
    background: #f5f5f5;
    color: #404040;
    border: 1px solid #e5e5e5;
  }
  .ps-list { border-top: 1px solid #e5e5e5; }
  .ps-row {
    display: grid;
    grid-template-columns: 56px 1fr 52px;
    gap: 12px;
    align-items: center;
    min-height: 72px;
    padding: 12px 20px;
    border-bottom: 1px solid #e5e5e5;
    cursor: pointer;
  }
  .ps-row:active { background: #f5f5f5; }
  .ps-thumb {
    position: relative;
    width: 56px;
    height: 56px;
    border-radius: 12px;
    overflow: hidden;
    background: #e5e5e5;
  }
  .ps-thumb svg { width: 100%; height: 100%; display: block; }
  .ps-thumb-n {
    position: absolute;
    left: 6px;
    bottom: 5px;
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.55);
  }
  .ps-row[data-shot] .ps-thumb {
    outline: 2px solid #111;
    outline-offset: 1px;
  }
  .ps-row[data-shot] .ps-thumb::after {
    content: "✓";
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(17,17,17,0.42);
    color: #fff;
    font-size: 18px;
    font-weight: 700;
  }
  .ps-row[data-shot] .ps-row-t { color: #a3a3a3; text-decoration: line-through; }
  .ps-row-t { font-size: 15px; font-weight: 600; }
  .ps-row-d { font-size: 12px; color: #737373; margin-top: 2px; }
  .ps-mark {
    height: 34px;
    padding: 0 10px;
    border-radius: 10px;
    border: 1px solid #d4d4d4;
    background: #fff;
    font-size: 12px;
    font-weight: 650;
    color: #404040;
    cursor: pointer;
    transition: transform 140ms ease-out, background 160ms ease-out, color 160ms ease-out, border-color 160ms ease-out;
  }
  .ps-row[data-shot] .ps-mark {
    border-color: #111;
    background: #111;
    color: #fff;
  }
  .ps-pkg {
    padding: 14px 20px 8px;
    background: #f5f5f5;
    border-top: 1px solid #e5e5e5;
  }
  .ps-pkg-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 0;
  }
  .ps-pkg-row + .ps-pkg-row { border-top: 1px solid #e5e5e5; }
  .ps-pkg-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #a3a3a3;
    margin-bottom: 4px;
  }
  .ps-pkg-body {
    font-size: 13px;
    line-height: 1.4;
    color: #404040;
    max-width: 42ch;
  }
  .ps-pkg-copy {
    flex: 0 0 auto;
    height: 34px;
    padding: 0 12px;
    border-radius: 10px;
    border: 1px solid #d4d4d4;
    background: #fff;
    font-size: 12px;
    font-weight: 650;
    color: #111;
    cursor: pointer;
    transition: transform 140ms ease-out;
  }
  .ps-dock {
    padding: 12px 16px 10px;
    background: #fff;
    border-top: 1px solid #e5e5e5;
  }
  .ps-primary {
    width: 100%;
    height: 52px;
    border: 0;
    border-radius: 14px;
    background: #111;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 140ms ease-out;
  }
  .ps-secondary {
    width: 100%;
    margin-top: 8px;
    height: 40px;
    border: 0;
    background: transparent;
    color: #737373;
    font-size: 13px;
    font-weight: 650;
    cursor: pointer;
    transition: transform 140ms ease-out;
  }

  /* ——— Archive ——— */
  .ar-head { padding: 4px 20px 12px; }
  .ar-title {
    font-size: 28px;
    font-weight: 650;
    letter-spacing: -0.03em;
    margin: 0 0 4px;
  }
  .ar-sub {
    font-size: 13px;
    color: #737373;
    margin: 0;
  }
  .ar-filters {
    display: flex;
    gap: 8px;
    padding: 0 20px 14px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .ar-filters::-webkit-scrollbar { display: none; }
  .ar-filter {
    flex: 0 0 auto;
    height: 32px;
    padding: 0 12px;
    border-radius: 999px;
    border: 1px solid #e5e5e5;
    background: #fff;
    color: #404040;
    font-size: 12px;
    font-weight: 650;
    cursor: pointer;
    transition: transform 140ms ease-out, background 140ms ease-out, color 140ms ease-out, border-color 140ms ease-out;
  }
  .ar-filter[data-on] {
    background: #111;
    border-color: #111;
    color: #fff;
  }
  .ar-list { border-top: 1px solid #e5e5e5; }
  .ar-row {
    display: grid;
    grid-template-columns: 56px 1fr 56px;
    gap: 12px;
    align-items: center;
    padding: 14px 20px;
    border-bottom: 1px solid #e5e5e5;
    cursor: pointer;
    width: 100%;
    text-align: left;
    background: transparent;
    border-left: 0;
    border-right: 0;
    border-top: 0;
    font: inherit;
    color: inherit;
  }
  .ar-row:active { background: #f5f5f5; }
  .ar-day {
    font-size: 14px;
    font-weight: 650;
  }
  .ar-date {
    font-size: 11px;
    color: #737373;
    margin-top: 2px;
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  .ar-card {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .ar-out {
    font-size: 12px;
    color: #525252;
    margin-top: 3px;
  }
  .ar-out[data-soft] { color: #a3a3a3; }
  .ar-thumb {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    overflow: hidden;
    background: #e5e5e5;
  }
  .ar-thumb svg { width: 100%; height: 100%; display: block; }
  .ar-empty {
    padding: 48px 24px;
    text-align: center;
    color: #737373;
    font-size: 14px;
  }

  /* Archive detail sheet */
  .sheet {
    position: absolute;
    inset: 0;
    z-index: 30;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    background: rgba(0,0,0,0.28);
    opacity: 0;
    pointer-events: none;
    transition: opacity 180ms ease-out;
  }
  .sheet[data-open] {
    opacity: 1;
    pointer-events: auto;
  }
  .sheet-panel {
    background: #fafafa;
    border-radius: 24px 24px 0 0;
    padding: 10px 20px 28px;
    transform: translateY(12px);
    transition: transform 220ms cubic-bezier(0.23, 1, 0.32, 1);
  }
  .sheet[data-open] .sheet-panel { transform: none; }
  .sheet-handle {
    width: 36px;
    height: 4px;
    border-radius: 99px;
    background: #d4d4d4;
    margin: 4px auto 16px;
  }
  .sheet-meta {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #737373;
    margin-bottom: 6px;
  }
  .sheet-title {
    font-size: 22px;
    font-weight: 650;
    letter-spacing: -0.02em;
    margin: 0 0 14px;
    line-height: 1.2;
  }
  .sheet-chip {
    display: inline-flex;
    align-items: center;
    height: 28px;
    padding: 0 10px;
    border-radius: 999px;
    border: 1px solid #e5e5e5;
    background: #fff;
    font-size: 12px;
    font-weight: 650;
    margin-bottom: 12px;
  }
  .sheet-body {
    font-size: 14px;
    line-height: 1.45;
    color: #404040;
    margin: 0 0 8px;
  }
  .sheet-note {
    font-size: 12px;
    color: #737373;
    margin: 0 0 18px;
  }
  .sheet-done {
    width: 100%;
    height: 48px;
    border: 0;
    border-radius: 14px;
    background: #111;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 140ms ease-out;
  }

  /* ——— Profile ——— */
  .pf-head { padding: 4px 20px 16px; }
  .pf-title {
    font-size: 28px;
    font-weight: 650;
    letter-spacing: -0.03em;
    margin: 0;
  }
  .pf-block {
    margin: 0 20px 14px;
    border: 1px solid #e5e5e5;
    border-radius: 16px;
    background: #fff;
    overflow: hidden;
  }
  .pf-block-h {
    padding: 12px 16px 0;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #a3a3a3;
  }
  .pf-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    border-top: 1px solid #f0f0f0;
    font-size: 14px;
  }
  .pf-block > .pf-row:first-of-type { border-top: 0; }
  .pf-row-title { font-weight: 600; }
  .pf-row-sub {
    font-size: 12px;
    color: #737373;
    margin-top: 2px;
  }
  .pf-chip {
    flex: 0 0 auto;
    height: 26px;
    padding: 0 10px;
    border-radius: 999px;
    border: 1px solid #e5e5e5;
    background: #f5f5f5;
    font-size: 11px;
    font-weight: 650;
    color: #404040;
  }
  .pf-chip[data-live] {
    background: #111;
    border-color: #111;
    color: #fff;
  }
  .pf-link {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border: 0;
    border-top: 1px solid #f0f0f0;
    background: transparent;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    color: #111;
    cursor: pointer;
    text-align: left;
    transition: transform 140ms ease-out, background 140ms ease-out;
  }
  .pf-link:active { background: #f5f5f5; }
  .pf-link span { color: #a3a3a3; font-weight: 500; }
  .pf-actions {
    padding: 4px 20px 20px;
  }
  .pf-signout {
    width: 100%;
    height: 50px;
    border-radius: 14px;
    border: 1px solid #d4d4d4;
    background: #fff;
    font-size: 15px;
    font-weight: 650;
    color: #111;
    cursor: pointer;
    transition: transform 140ms ease-out;
  }
  .pf-refresh {
    height: 36px;
    padding: 0 12px;
    border-radius: 10px;
    border: 1px solid #d4d4d4;
    background: #fff;
    font-size: 12px;
    font-weight: 650;
    cursor: pointer;
    transition: transform 140ms ease-out;
  }
  .pf-foot {
    padding: 0 20px 8px;
    font-size: 12px;
    color: #a3a3a3;
  }
</style>
</head>
<body>
  <!--
    PROTOTYPE — throwaway. Do not ship.
    Full Pocket Sheet shell: Today · Archive · Profile
    Chosen direction: monochrome Pocket Sheet
  -->
  <div class="harness-meta">
    <div><strong>PROTOTYPE</strong> · Pocket Sheet shell</div>
    <div id="route-label">Today</div>
  </div>

  <div class="harness">
    <div class="phone">
      <div class="phone-notch" aria-hidden="true"></div>
      <div id="app"></div>
      <div class="toast" id="toast" role="status"></div>
    </div>
  </div>

<script>
const CARD = {
  date: "30 July 2026",
  title: "Race week has entered the house",
  effort: "Easy · 10 min",
  scenes: [
    { n: 1, title: "Shoes by the door", duration: "3 sec" },
    { n: 2, title: "Open the journal", duration: "4 sec" },
    { n: 3, title: "Bottle, timer, breath", duration: "3 sec" },
    { n: 4, title: "One steady stride", duration: "2 sec" },
  ],
  caption: "Race week starts quiet. Shoes by the door. One honest line in the journal. Then out.",
  audio: "Steady mid-tempo — keep VO soft over the first stride.",
};

const ARCHIVE = [
  { id: "a1", day: "Tue", date: "29 Jul", title: "Sharpen, don't chase", decision: "posted", label: "Posted", output: "Reel posted · 4 scenes", filter: "posted", thumb: 4 },
  { id: "a2", day: "Mon", date: "28 Jul", title: "Reset Monday", decision: "posted", label: "Posted", output: "Stories posted · quiet open", filter: "posted", thumb: 2 },
  { id: "a3", day: "Sun", date: "27 Jul", title: "Open family moment", decision: "backup", label: "Used backup", output: "Short story instead of primary", filter: "backup", thumb: 1 },
  { id: "a4", day: "Sat", date: "26 Jul", title: "Race day. Let's go.", decision: "skipped", label: "Skipped", output: "Saved energy for race morning", filter: "skipped", thumb: null },
  { id: "a5", day: "Fri", date: "25 Jul", title: "Shakeout and mindset", decision: "posted", label: "Shot", output: "All scenes shot · posted later", filter: "posted", thumb: 3 },
  { id: "a6", day: "Thu", date: "24 Jul", title: "Fuel the engine", decision: "backup", label: "Used backup", output: "Caption-only fallback", filter: "backup", thumb: null },
];

const state = {
  tab: "today",
  shot: new Set(),
  archiveFilter: "all",
  archiveDetail: null,
  refreshedAt: null,
};

let toastTimer;
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.setAttribute("data-show", "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.removeAttribute("data-show"), 1400);
}

function statusBar() {
  return `<div class="sb"><span>9:41</span><span>●●●</span></div>`;
}

function tabs() {
  return `
    <nav class="tabs" aria-label="Primary">
      <button class="tab" ${state.tab === "today" ? "data-on" : ""} onclick="setTab('today')">Today</button>
      <button class="tab" ${state.tab === "archive" ? "data-on" : ""} onclick="setTab('archive')">Archive</button>
      <button class="tab" ${state.tab === "profile" ? "data-on" : ""} onclick="setTab('profile')">Profile</button>
    </nav>`;
}

function sceneArt(n) {
  return [
    `<rect width="56" height="56" fill="#2a2a2a"/><rect x="8" y="28" width="18" height="10" rx="3" fill="#9a9a9a"/><rect x="30" y="26" width="18" height="12" rx="3" fill="#b0b0b0"/><rect x="6" y="8" width="8" height="40" rx="2" fill="#6a6a6a"/>`,
    `<rect width="56" height="56" fill="#1f1f1f"/><rect x="14" y="10" width="28" height="36" rx="3" fill="#d4d4d4"/><rect x="18" y="16" width="20" height="2" fill="#8a8a8a"/><rect x="18" y="22" width="16" height="2" fill="#8a8a8a"/><rect x="18" y="28" width="18" height="2" fill="#8a8a8a"/>`,
    `<rect width="56" height="56" fill="#333"/><rect x="12" y="18" width="12" height="26" rx="4" fill="#cfcfcf"/><circle cx="38" cy="28" r="10" fill="#a3a3a3"/><circle cx="38" cy="28" r="6" fill="#333"/><rect x="37" y="20" width="2" height="8" fill="#eee"/>`,
    `<rect width="56" height="56" fill="#242424"/><path d="M16 40c6-10 10-16 14-16s6 4 10 12" stroke="#d4d4d4" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="20" cy="22" r="4" fill="#bdbdbd"/>`,
  ][n - 1];
}

function toggleShot(n) {
  if (state.shot.has(n)) state.shot.delete(n);
  else state.shot.add(n);
  showToast(state.shot.has(n) ? `Scene ${n} marked shot` : `Scene ${n} unmarked`);
  render();
}

function copyText(label, text) {
  navigator.clipboard?.writeText(text).catch(() => {});
  showToast(`${label} copied`);
}

function primaryLabel() {
  const total = CARD.scenes.length;
  if (state.shot.size === total) return "I’m done — mark posted";
  if (state.shot.size === 0) return "Mark remaining as shot";
  return `Mark remaining (${total - state.shot.size})`;
}

function renderToday() {
  const rows = CARD.scenes.map(s => `
    <div class="ps-row" ${state.shot.has(s.n) ? "data-shot" : ""}>
      <div class="ps-thumb" onclick="toggleShot(${s.n})">
        <svg viewBox="0 0 56 56" aria-hidden="true">${sceneArt(s.n)}</svg>
        <span class="ps-thumb-n">${String(s.n).padStart(2,"0")}</span>
      </div>
      <div onclick="toggleShot(${s.n})">
        <div class="ps-row-t">${s.title}</div>
        <div class="ps-row-d">${s.duration}</div>
      </div>
      <button class="ps-mark press" onclick="event.stopPropagation(); toggleShot(${s.n})">${state.shot.has(s.n) ? "Undo" : "Shot"}</button>
    </div>`).join("");

  return `
    ${statusBar()}
    <div class="screen">
      <div class="ps-head">
        <div class="ps-kicker">Today · ${CARD.date}</div>
        <h1 class="ps-title">${CARD.title}</h1>
      </div>
      <div class="ps-rail">
        <span class="ps-pill">${state.shot.size}/${CARD.scenes.length} shot</span>
        <span class="ps-pill">${CARD.effort}</span>
      </div>
      <div class="ps-list">${rows}</div>
      <div class="ps-pkg">
        <div class="ps-pkg-row">
          <div>
            <div class="ps-pkg-label">Caption</div>
            <div class="ps-pkg-body">${CARD.caption}</div>
          </div>
          <button class="ps-pkg-copy press" onclick="copyText('Caption', CARD.caption)">Copy</button>
        </div>
        <div class="ps-pkg-row">
          <div>
            <div class="ps-pkg-label">Audio</div>
            <div class="ps-pkg-body">${CARD.audio}</div>
          </div>
          <button class="ps-pkg-copy press" onclick="copyText('Audio', CARD.audio)">Copy</button>
        </div>
      </div>
    </div>
    <div class="ps-dock">
      <button class="ps-primary press" onclick="showToast(state.shot.size === CARD.scenes.length ? 'Marked posted' : 'Marked remaining shot')">${primaryLabel()}</button>
      <button class="ps-secondary press" onclick="showToast('Other ideas sheet')">Need something easier</button>
    </div>
    ${tabs()}`;
}

function setArchiveFilter(f) {
  state.archiveFilter = f;
  render();
}

function openArchive(id) {
  state.archiveDetail = ARCHIVE.find(e => e.id === id) || null;
  render();
}

function closeArchive() {
  state.archiveDetail = null;
  render();
}

function filteredArchive() {
  if (state.archiveFilter === "all") return ARCHIVE;
  return ARCHIVE.filter(e => e.filter === state.archiveFilter);
}

function renderArchive() {
  const filters = [
    ["all", "All"],
    ["posted", "Completed"],
    ["backup", "Backups"],
    ["skipped", "Skipped"],
  ];
  const entries = filteredArchive();
  const rows = entries.length
    ? entries.map(e => `
      <button class="ar-row" onclick="openArchive('${e.id}')">
        <div>
          <div class="ar-day">${e.day}</div>
          <div class="ar-date">${e.date}</div>
        </div>
        <div>
          <div class="ar-card">${e.title}</div>
          <div class="ar-out" ${e.filter !== "posted" ? "data-soft" : ""}>${e.label} · ${e.output}</div>
        </div>
        ${e.thumb
          ? `<div class="ar-thumb"><svg viewBox="0 0 56 56">${sceneArt(e.thumb)}</svg></div>`
          : `<div class="ar-thumb" style="display:grid;place-items:center;color:#a3a3a3;font-size:18px">›</div>`}
      </button>`).join("")
    : `<div class="ar-empty">Nothing in this filter yet.</div>`;

  const detail = state.archiveDetail;
  const sheet = `
    <div class="sheet" ${detail ? "data-open" : ""} onclick="if(event.target===this) closeArchive()">
      <div class="sheet-panel" role="dialog" aria-modal="true">
        <div class="sheet-handle"></div>
        ${detail ? `
          <div class="sheet-meta">${detail.day} · ${detail.date}</div>
          <h2 class="sheet-title">${detail.title}</h2>
          <div class="sheet-chip">${detail.label}</div>
          <p class="sheet-body">${detail.output}</p>
          <p class="sheet-note">${detail.thumb ? "Post output was recorded." : "No post thumbnail was attached."}</p>
          <button class="sheet-done press" onclick="closeArchive()">Done</button>
        ` : ""}
      </div>
    </div>`;

  return `
    ${statusBar()}
    <div class="screen">
      <div class="ar-head">
        <h1 class="ar-title">Archive</h1>
        <p class="ar-sub">Past decisions — no streak pressure.</p>
      </div>
      <div class="ar-filters">
        ${filters.map(([id, label]) => `
          <button class="ar-filter press" ${state.archiveFilter === id ? "data-on" : ""} onclick="setArchiveFilter('${id}')">${label}</button>
        `).join("")}
      </div>
      <div class="ar-list">${rows}</div>
    </div>
    ${tabs()}
    ${sheet}`;
}

function refreshStatus() {
  state.refreshedAt = new Date();
  showToast("Status refreshed");
  render();
}

function renderProfile() {
  const when = state.refreshedAt
    ? state.refreshedAt.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
    : "—";
  return `
    ${statusBar()}
    <div class="screen">
      <div class="pf-head">
        <h1 class="pf-title">Profile</h1>
      </div>

      <div class="pf-block">
        <div class="pf-block-h">Account</div>
        <div class="pf-row">
          <div>
            <div class="pf-row-title">Signed in with Apple</div>
            <div class="pf-row-sub">Creator · contenthelper</div>
          </div>
          <span class="pf-chip" data-live>Live</span>
        </div>
        <button class="pf-link" onclick="showToast('Open Plan hub')">
          Plan
          <span>Prep · generate · edit ›</span>
        </button>
      </div>

      <div class="pf-block">
        <div class="pf-block-h">Status</div>
        <div class="pf-row">
          <div class="pf-row-title">Supabase</div>
          <span class="pf-chip" data-live>Live</span>
        </div>
        <div class="pf-row">
          <div class="pf-row-title">Gemini</div>
          <span class="pf-chip" data-live>Live</span>
        </div>
        <div class="pf-row">
          <div>
            <div class="pf-row-title">Last checked</div>
            <div class="pf-row-sub">${when === "—" ? "Not refreshed yet" : "Up to date as of " + when}</div>
          </div>
          <button class="pf-refresh press" onclick="refreshStatus()">Refresh</button>
        </div>
      </div>

      <div class="pf-actions">
        <button class="pf-signout press" onclick="showToast('Signed out (prototype)')">Sign out</button>
      </div>
      <div class="pf-foot">Prototype shell — Pocket Sheet language across Today, Archive, Profile.</div>
    </div>
    ${tabs()}`;
}

function setTab(tab) {
  state.tab = tab;
  state.archiveDetail = null;
  const url = new URL(location);
  url.searchParams.set("tab", tab);
  history.replaceState(null, "", url);
  render();
}

function render() {
  const app = document.getElementById("app");
  const label = document.getElementById("route-label");
  label.textContent = state.tab[0].toUpperCase() + state.tab.slice(1);
  if (state.tab === "today") app.innerHTML = renderToday();
  else if (state.tab === "archive") app.innerHTML = renderArchive();
  else app.innerHTML = renderProfile();
}

document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "1") setTab("today");
  else if (e.key === "2") setTab("archive");
  else if (e.key === "3") setTab("profile");
  else if (e.key === "Escape" && state.archiveDetail) closeArchive();
});

const initial = (new URLSearchParams(location.search).get("tab") || "today").toLowerCase();
state.tab = ["today", "archive", "profile"].includes(initial) ? initial : "today";
render();
</script>
</body>
</html>
