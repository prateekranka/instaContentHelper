name: Backend checks

on:
  pull_request:
  push:
    branches:
      - main
      - codex/day-at-a-time-generation
      - redesign/creator-loop
      - codex/mira-ios-mvp

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-rules:
    name: Creator loop agent rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository history for the fixed Step 5 baseline
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Check state-machine tables
        run: python3 scripts/check-state-machine-doc.py
      - name: Check agent rules
        run: python3 scripts/check-agent-rules.py
      - name: Prove rules reject past mistakes
        run: python3 scripts/prove-agent-rules.py
  tla-models:
    name: TLA+ models
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache TLC jar
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: work/tla-cache
          key: tla2tools-${{ hashFiles('specs/tla/run.sh') }}
      - name: Check TLA+ models
        run: specs/tla/run.sh
  deno:
    name: Deno contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Type-check backend without unit tests
        run: deno task ci:backend
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Install locked verification dependencies
        run: npm ci --ignore-scripts
      - name: Run Mira endpoint system scenarios
        run: npx e2e run --config e2e.mira-api.config.ts
