name: Mira workflow contracts
on:
  push:
    branches: [codex/mira-ios-mvp]
    paths: ['CreatorContentOS/Mira/Core/**', 'Tests/MiraCoreTests/**', 'Package.swift', 'scripts/mira-core-check.sh', 'scripts/mira-sql-check.py', 'supabase/migrations/*mira*', 'supabase/functions/mira-generation/jobs_test.sql', '.github/workflows/mira-core-checks.yml']
  pull_request:
    paths: ['CreatorContentOS/Mira/Core/**', 'Tests/MiraCoreTests/**', 'Package.swift', 'scripts/mira-core-check.sh', 'scripts/mira-sql-check.py', 'supabase/migrations/*mira*', 'supabase/functions/mira-generation/jobs_test.sql', '.github/workflows/mira-core-checks.yml']
permissions:
  contents: read
jobs:
  swift:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install pinned Swift
        run: |
          mkdir -p work/swift
          curl -fL --retry 2 https://download.swift.org/swift-6.4.1-release/ubuntu2404/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE-ubuntu24.04.tar.gz -o work/swift.tar.gz
          echo '7d246c7114077ad01dba4ad897628446ada4c489d6c7dbcf39ae3f25cbe17e8b  work/swift.tar.gz' | sha256sum -c -
          tar -xzf work/swift.tar.gz --strip-components=1 -C work/swift
      - name: Compile and check real domain implementation
        run: MIRA_SWIFT_BIN="$PWD/work/swift/usr/bin/swift" bash scripts/mira-core-check.sh
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Verify migration and job leases in isolated PostgreSQL
        run: python3 scripts/mira-sql-check.py
